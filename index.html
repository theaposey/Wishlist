  function closeItemSheet() {
    const sheet = document.getElementById('item-sheet');
    const backdrop = document.getElementById('item-sheet-backdrop');
    if (sheet) {
      sheet.style.animation = 'itemSheetOut 0.26s cubic-bezier(0.4, 0, 1, 1) both';
      if (backdrop) backdrop.style.animation = 'fadeIn 0.22s ease reverse both';
    }
    setTimeout(() => { s.overlay = null; render(); }, 240);
  }

  function sheetDragStart(e) {
    if (e.pointerType === 'mouse') return;
    const sheet = document.getElementById('item-sheet');
    const scroll = document.getElementById('item-sheet-scroll');
    if (!sheet) return;

    const fromHandle = e.target.closest('.item-sheet-handle');
    // Allow drag from anywhere when scroll is at top; handle always works
    if (!fromHandle && scroll && scroll.scrollTop > 2) return;

    const startY = e.clientY;
    let dy = 0, lastY = startY, velY = 0, decided = false, isDown = false;

    function onMove(ev) {
      const y = ev.clientY - startY;
      if (!decided) {
        if (Math.abs(y) < 5) return;
        isDown = y > 0; decided = true;
        if (!isDown) { cleanup(); return; }
        sheet.style.transition = 'none';
      }
      if (!isDown) return;
      ev.preventDefault();
      dy = Math.max(0, y);
      velY = ev.clientY - lastY;
      lastY = ev.clientY;
      sheet.style.transform = `translateY(${dy}px)`;
    }

    function onUp() {
      cleanup();
      if (!isDown || !decided) return;
      const backdrop = document.getElementById('item-sheet-backdrop');
      if (dy > 100 || velY > 6) {
        sheet.style.transition = 'transform 0.28s cubic-bezier(0.4,0,1,1)';
        sheet.style.transform = 'translateY(110%)';
        if (backdrop) { backdrop.style.transition = 'opacity 0.28s ease'; backdrop.style.opacity = '0'; }
        setTimeout(() => { s.overlay = null; render(); }, 270);
      } else {
        sheet.style.transition = 'transform 0.42s cubic-bezier(0.16,1,0.3,1)';
        sheet.style.transform = '';
        setTimeout(() => { sheet.style.transition = ''; }, 420);
      }
    }

    function cleanup() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }

    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // Detect Cloudflare/CDN challenge pages, error pages, bot-protection walls, etc.
  function isBlockedPage(html, title) {
    const t = (title || '').toLowerCase().trim();
    const JUNK = [
      'just a moment', 'checking your browser', 'please wait',
      'access denied', '403 forbidden', '401 unauthorized',
      'please enable javascript', 'please enable cookies',
      'are you a robot', 'robot or human', 'ddos protection',
      'attention required', 'security check', 'one moment please',
      'enable javascript and cookies', 'verify you are human',
      'sorry, you have been blocked', 'captcha',
      // CloudFront / CDN error pages
      'request could not be satisfied', 'error occurred when we tried',
      '404 not found', '500 internal server', 'service unavailable',
      'bad gateway', 'gateway timeout',
      // Akamai / Imperva / PerimeterX / generic WAF block pages — common on
      // luxury retail sites (Net-a-Porter, etc.) with aggressive bot protection
      'pardon our interruption', 'reference id', 'incapsula incident',
      'request unsuccessful', 'unusual traffic', 'automated access',
      'protected by akamai', 'powered and protected by',
      'blocked by network security', 'has been blocked',
    ];
    if (JUNK.some(j => t.includes(j))) return true;
    // Title starts with "ERROR" or "error" with no product-like content
    if (/^error[:\s]/i.test(t)) return true;
    // "Forbidden - Depop", "Forbidden | Site" — bare error-page titles.
    // (Not a plain `t.includes('forbidden')` check — that would also flag a
    // legitimately named product like "Forbidden Fruit Eau de Parfum".)
    if (/^forbidden\s*[-|–—]/i.test(t)) return true;
    if (!t) return true; // no title at all = not a product page
    // Cloudflare JS challenge HTML markers
    if (html.includes('cf-browser-verification') ||
        html.includes('_cf_chl_opt') ||
        html.includes('cdn-cgi/challenge-platform') ||
        html.includes('jschl_answer') ||
        html.includes('cf_chl_2') ||
        html.includes('__cf_chl_rt_tk')) return true;
    return false;
  }

  // Strip UTM/ad tracking params that bloat URLs and can trigger bot detection
  function cleanUrl(urlStr) {
    try {
      const u = new URL(urlStr);
      const TRACKING = [
        'utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id',
        'gclid','gclsrc','gbraid','wbraid','fbclid','msclkid','ttclid','twclid',
        'gad_source','gad_campaignid','campaignid','adgroupid','adpos','creative',
        'device','matchtype','network','targetid','pla_sku','pla_country','pcat','storeid',
        'cm_mmc','cm_sp','cm_re','a','ref','referrer','source','mc_cid','mc_eid','_ga','_gl',
      ];
      const toDelete = [...u.searchParams.keys()].filter(k => TRACKING.includes(k) || /^vtp\d+$/i.test(k));
      toDelete.forEach(k => u.searchParams.delete(k));
      return u.toString();
    } catch { return urlStr; }
  }

  // Extract product name/brand from URL slug when all proxies fail
  function parseUrlFallback(urlStr) {
    try {
      const u = new URL(urlStr);
      const host = u.hostname.replace(/^www\./, '');
      const parts = u.pathname.split('/').filter(Boolean).map(p => p.split('?')[0]);

      function slugToTitle(s) {
        return s.replace(/-\d{5,}$/, '').split('-').filter(Boolean)
          .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ').trim();
      }

      let brand = '', name = '', img = '';

      // Net-a-Porter: /en-us/shop/product/{brand}/{cat}/{subcat}/{product-slug}/{id}
      if (host.includes('net-a-porter.com') || host.includes('mrporter.com')) {
        const idx = parts.indexOf('product');
        if (idx >= 0) {
          brand = slugToTitle(parts[idx + 1] || '');
          name  = slugToTitle(parts[idx + 4] || parts[idx + 3] || '');
          // NAP product images follow a predictable CDN pattern keyed on numeric product ID
          const productId = parts[parts.length - 1];
          if (/^\d{10,}$/.test(productId)) {
            img = `https://www.net-a-porter.com/variants/images/${productId}/in/w2000_q60.jpg`;
          }
        }
      }
      // SSENSE: /en-us/{gender}/product/{brand}/{product-slug}/p{id}
      else if (host.includes('ssense.com')) {
        const pIdx = parts.indexOf('product');
        if (pIdx >= 0) {
          brand = slugToTitle(parts[pIdx + 1] || '');
          name  = slugToTitle((parts[pIdx + 2] || '').replace(/-p\d+$/, ''));
        } else {
          // Fallback: skip locale + gender/category words
          const SKIP = /^[a-z]{2}-[a-z]{2}$|^(women|men|everything|kids|lifestyle|sale|new|designers)$/i;
          const seg = parts.filter(p => !SKIP.test(p));
          brand = slugToTitle(seg[0] || '');
          name  = slugToTitle((seg[1] || '').replace(/-p\d+$/, ''));
        }
      }
      // Mytheresa: /us-en/p/{product-slug}-{sku}.html
      else if (host.includes('mytheresa.com')) {
        const pIdx = parts.indexOf('p');
        if (pIdx >= 0) name = slugToTitle(parts[pIdx + 1]?.replace(/\.html$/, '').replace(/-[a-z0-9]{4,10}$/, '') || '');
      }
      // Bloomingdale's: /shop/product/{product-slug}?ID={id}
      else if (host.includes('bloomingdales.com')) {
        const pIdx = parts.indexOf('product');
        const slug = pIdx >= 0 ? (parts[pIdx + 1] || '') : (parts[parts.length - 1] || '');
        name = slugToTitle(slug);
        brand = 'Bloomingdale\'s';
      }
      // CB2: /{product-slug}/s{sku}
      else if (host.includes('cb2.com')) {
        brand = 'CB2';
        name  = slugToTitle((parts[0] || '').replace(/-s\d+$/, ''));
      }
      // Crate & Barrel: /p/{product-slug}/{sku} or /{product-slug}/r{sku}
      else if (host.includes('crateandbarrel.com')) {
        brand = 'Crate & Barrel';
        const pIdx = parts.indexOf('p');
        name = slugToTitle(pIdx >= 0 ? (parts[pIdx + 1] || '') : (parts[0] || '').replace(/-r\d+$/, ''));
      }
      // Farfetch: /shopping/{product-slug}-item-{id}.aspx
      else if (host.includes('farfetch.com')) {
        const seg = parts.find(p => p.includes('-item-')) || parts[parts.length - 1] || '';
        name = slugToTitle(seg.replace(/-item-\d+\.aspx$/, '').replace(/\.aspx$/, ''));
      }
      // Browns Fashion: /en-us/{brand}/{product-slug}
      else if (host.includes('brownsfashion.com')) {
        const nonLocale = parts.filter(p => !/^[a-z]{2}(-[a-z]{2})?$/.test(p));
        brand = slugToTitle(nonLocale[0] || '');
        name  = slugToTitle(nonLocale[1] || '');
      }
      // Matches / MatchesFashion: /{brand}/{product-slug}
      else if (host.includes('matchesfashion.com')) {
        brand = slugToTitle(parts[0] || '');
        name  = slugToTitle(parts[1] || '');
      }
      // TheRealReal: /products/{gender}/{category}/{subcategory}/{brand-slug}-{product-slug}-{sku}
      else if (host.includes('therealreal.com')) {
        const slug = parts[parts.length - 1] || '';
        // Strip trailing SKU — short alphanumeric segment containing at least one digit
        const withoutSku = slug.replace(/-([a-z0-9]{3,8})$/i, (_, s) => /[0-9]/.test(s) ? '' : `-${s}`);
        const segs = withoutSku.split('-').filter(Boolean);
        // First word = brand, remainder = product name
        brand = slugToTitle(segs[0] || '');
        name  = slugToTitle(segs.slice(1).join('-'));
      }
      // Coach: /products/{product-slug}/{SKU}.html
      else if (host.includes('coach.com')) {
        brand = 'Coach';
        const pIdx = parts.indexOf('products');
        if (pIdx >= 0) {
          // Last segment is a SKU/color code (.html) — product slug is one before it
          const slug = parts[pIdx + 1] || '';
          name = slugToTitle(slug.replace(/\.html$/, ''));
        }
      }
      // Shopify: /products/{product-slug}
      else if (parts.includes('products')) {
        const pIdx = parts.indexOf('products');
        // If the last segment looks like a SKU (no hyphens, or just an alphanumeric code),
        // prefer the segment right after 'products' as the product slug
        const lastSeg = parts[parts.length - 1] || '';
        const isSkuLike = /^[A-Z0-9]{4,10}(\.html)?$/i.test(lastSeg) && !lastSeg.includes('-');
        const slug = isSkuLike ? (parts[pIdx + 1] || lastSeg) : lastSeg;
        name = slugToTitle(slug.replace(/\.html$/, ''));
        // Infer brand from hostname, skipping common prefixes
        const SKIP_HOST = new Set(['www','shop','store','us','uk','ca','en']);
        const brandSeg = host.split('.').find(s => !SKIP_HOST.has(s) && s.length > 1);
        if (brandSeg) brand = brandSeg.charAt(0).toUpperCase() + brandSeg.slice(1);
      }
      // Generic: longest hyphenated path segment = product name
      else {
        const candidates = parts
          .filter(p => p.includes('-') && p.length > 10)
          .sort((a, b) => b.split('-').length - a.split('-').length);
        name = candidates.length ? slugToTitle(candidates[0]) : '';
      }

      return (name || brand) ? { name, brand, img } : null;
    } catch { return null; }
  }

  function cleanTitle(t) {
    t = (t || '').trim();
    // Strip up to two trailing "| Site Name" or "– Brand" suffixes
    t = t.replace(/\s*[\|\u2014\u2013\-][^\|\u2014\u2013\-]{2,60}$/, '').trim();
    t = t.replace(/\s*[\|\u2014\u2013\-][^\|\u2014\u2013\-]{2,60}$/, '').trim();
    return t;
  }

  // ═══════════════════════════════════════════
  // CATEGORY TAXONOMY
  // ═══════════════════════════════════════════

  const CATEGORY_TAXONOMY = {
    fashion: { label: 'Fashion', subcategories: ['tops', 'dresses', 'skirts', 'pants', 'outerwear', 'shoes', 'bags', 'accessories'] },
    beauty:  { label: 'Beauty',  subcategories: [] },
    home:    { label: 'Home',    subcategories: [] },
  };
  const SUBCATEGORY_LABELS = {
    tops: 'Tops', dresses: 'Dresses', skirts: 'Skirts', pants: 'Pants',
    outerwear: 'Outerwear', shoes: 'Shoes', bags: 'Bags', accessories: 'Accessories',
  };

  // Keyword → subcategory, checked as whole words against the item's name/brand/tags.
  // Site-specific category strings ("trousers", "denim") get normalized to our list.
  const SUBCATEGORY_KEYWORDS = {
    tops: ['top','tops','tee','t-shirt','tshirt','shirt','blouse','sweater','sweatshirt','hoodie','knit','knitwear','cardigan','tank','camisole','polo','turtleneck','jersey'],
    dresses: ['dress','dresses','gown','sundress'],
    skirts: ['skirt','skirts','miniskirt','midiskirt'],
    pants: ['pant','pants','trouser','trousers','jean','jeans','legging','leggings','chino','chinos','shorts','jogger','joggers','sweatpant','sweatpants'],
    outerwear: ['jacket','coat','outerwear','blazer','parka','vest','windbreaker','puffer','trench','anorak'],
    shoes: ['shoe','shoes','sneaker','sneakers','boot','boots','heel','heels','sandal','sandals','loafer','loafers','flat','flats','mule','mules','footwear'],
    bags: ['bag','bags','tote','backpack','clutch','purse','handbag','satchel','crossbody'],
    accessories: ['belt','scarf','hat','cap','beanie','sunglasses','jewelry','jewellery','necklace','earring','earrings','ring','bracelet','wallet','glove','gloves','tie','watch','accessory','accessories'],
  };
  const CATEGORY_KEYWORDS = {
    beauty: ['beauty','skincare','skin care','makeup','make-up','cosmetic','cosmetics','perfume','fragrance','cologne','serum','moisturizer','moisturiser','cleanser','lipstick','mascara','foundation','sunscreen','spf','shampoo','conditioner','lotion'],
    home: ['home','furniture','decor','décor','candle','vase','bedding','duvet','pillow','throw','rug','kitchen','mug','plate','cookware','glassware','lamp','tableware'],
  };

  function classifyItem({ name = '', brand = '', tags = [] } = {}) {
    const text = ` ${[name, brand, ...(tags || [])].join(' ')} `.toLowerCase();
    const hasWord = (word) => new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`).test(text);

    for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) {
      if (words.some(hasWord)) return { category: cat, subcategory: null };
    }
    for (const [sub, words] of Object.entries(SUBCATEGORY_KEYWORDS)) {
      if (words.some(hasWord)) return { category: 'fashion', subcategory: sub };
    }
    return { category: null, subcategory: null };
  }

  function parseOgFromHtml(html, baseUrl) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const og = p => doc.querySelector(`meta[property="${p}"]`)?.content?.trim() || '';
    const mt = n => doc.querySelector(`meta[name="${n}"]`)?.content?.trim() || '';
    const rawTitle = og('og:title') || mt('twitter:title') || doc.title || '';
    if (isBlockedPage(html, rawTitle)) throw new Error('blocked');
    const title = cleanTitle(rawTitle);

    // ── Image ─────────────────────────────────────────────────────────
    let image = og('og:image:secure_url') || og('product:image') || og('og:image') || mt('twitter:image') || '';
    if (image && !image.startsWith('http')) {
      try { image = new URL(image, baseUrl).href; } catch {}
    }
    // Fallback: <link rel="preload" as="image"> (common in Next.js/Nuxt apps)
    if (!image) {
      const preload = doc.querySelector('link[rel="preload"][as="image"][href]');
      if (preload) image = preload.getAttribute('href') || '';
    }
    // Fallback: lazy-loaded data-src images (pick first large one)
    if (!image) {
      for (const img of doc.querySelectorAll('img[data-src],img[data-lazy-src],img[data-original]')) {
        const src = img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('data-original') || '';
        if (src.startsWith('http') && !/placeholder|spinner|blank|gif/i.test(src)) { image = src; break; }
      }
    }
    // Fallback: srcset — pick highest declared width
    if (!image) {
      for (const img of doc.querySelectorAll('img[srcset]')) {
        const best = (img.getAttribute('srcset') || '').split(',')
          .map(s => s.trim().split(/\s+/))
          .filter(p => p[0]?.startsWith('http'))
          .sort((a, b) => (parseInt(b[1]) || 0) - (parseInt(a[1]) || 0))[0];
        if (best?.[0]) { image = best[0]; break; }
      }
    }
    // Fallback: JSON-LD structured data (Product schema image)
    if (!image) {
      for (const el of doc.querySelectorAll('script[type="application/ld+json"]')) {
        try {
          const digImg = o => {
            if (!o || typeof o !== 'object') return '';
            if (typeof o.image === 'string' && o.image.startsWith('http')) return o.image;
            if (Array.isArray(o.image) && o.image[0]?.startsWith?.('http')) return o.image[0];
            if (o.image?.url?.startsWith?.('http')) return o.image.url;
            if (o['@graph']) return digImg(o['@graph']);
            if (Array.isArray(o)) { for (const x of o) { const r = digImg(x); if (r) return r; } }
            return '';
          };
          const found = digImg(JSON.parse(el.textContent));
          if (found) { image = found; break; }
        } catch {}
      }
    }
    if (image && !image.startsWith('http')) {
      try { image = new URL(image, baseUrl).href; } catch {}
    }

    // ── Brand ─────────────────────────────────────────────────────────
    let brand = og('product:brand') || og('og:brand') || mt('twitter:data1') || '';
    // JSON-LD brand
    if (!brand) {
      for (const el of doc.querySelectorAll('script[type="application/ld+json"]')) {
        try {
          const digBrand = o => {
            if (!o || typeof o !== 'object') return '';
            if (typeof o.brand === 'string') return o.brand;
            if (o.brand?.name) return o.brand.name;
            if (o['@graph']) return digBrand(o['@graph']);
            if (Array.isArray(o)) { for (const x of o) { const r = digBrand(x); if (r) return r; } }
            return '';
          };
          brand = digBrand(JSON.parse(el.textContent));
          if (brand) break;
        } catch {}
      }
    }
    // __NEXT_DATA__ brand (SSENSE: designerName; Farfetch: brand.name)
    if (!brand) {
      const nd = html.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/)?.[1];
      if (nd) {
        try {
          const findBrand = (o, d = 0) => {
            if (d > 10 || !o || typeof o !== 'object') return '';
            for (const k of ['designerName','brandName','brand','makerName','manufacturer']) {
              const v = o[k];
              if (typeof v === 'string' && v.length > 1 && v.length < 60) return v;
              if (v?.name && typeof v.name === 'string') return v.name;
            }
            for (const v of Object.values(o)) {
              if (v && typeof v === 'object' && !Array.isArray(v)) { const r = findBrand(v, d+1); if (r) return r; }
            }
            return '';
          };
          brand = findBrand(JSON.parse(nd));
        } catch {}
      }
    }

    // ── Price ─────────────────────────────────────────────────────────
    let price = og('product:price:amount') || og('og:price:amount') || '';

    // JSON-LD structured data
    if (!price) {
      for (const el of doc.querySelectorAll('script[type="application/ld+json"]')) {
        try {
          const dig = o => {
            if (!o || typeof o !== 'object') return '';
            if (o.price != null) return String(o.price);
            if (o.lowPrice != null) return String(o.lowPrice);
            if (o.offers)  return dig(o.offers);
            if (o['@graph']) return dig(o['@graph']);
            if (Array.isArray(o)) { for (const x of o) { const r = dig(x); if (r) return r; } }
            return '';
          };
          price = dig(JSON.parse(el.textContent));
          if (price) break;
        } catch {}
      }
    }

    // __NEXT_DATA__ (Next.js SSR — covers SSENSE, Farfetch, Matches, Browns, etc.)
    if (!price) {
      const nd = html.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/)?.[1];
      if (nd) {
        try {
          const findPrice = (o, d = 0) => {
            if (d > 12 || !o || typeof o !== 'object') return '';
            for (const k of ['price','salePrice','currentPrice','priceValue','amount','retailPrice','formattedPrice','markdownPrice','basePrice','sellingPrice','discountedPrice']) {
              const v = o[k];
              if (v != null) {
                const s = String(v).replace(/[^0-9.]/g, '');
                if (/^\d+\.?\d*$/.test(s) && parseFloat(s) > 0) return s;
              }
            }
            for (const v of Object.values(o)) {
              if (v && typeof v === 'object' && !Array.isArray(v)) { const r = findPrice(v, d+1); if (r) return r; }
            }
            for (const v of Object.values(o)) {
              if (Array.isArray(v)) { for (const x of v) { const r = findPrice(x, d+1); if (r) return r; } }
            }
            return '';
          };
          price = findPrice(JSON.parse(nd));
        } catch {}
      }
    }

    // __NUXT__ / Nuxt SSR
    if (!price) {
      const nuxt = html.match(/window\.__NUXT__\s*=\s*(\{[\s\S]*?\});\s*<\/script>/)?.[1];
      if (nuxt) {
        try {
          const m = nuxt.match(/"price"\s*:\s*([\d.]+)/);
          if (m) price = m[1];
        } catch {}
      }
    }

    // Smallable: price stored in inline JSON as "price":{"EUR":{"amount":NNN}}
    if (!price && html.includes('smallable.com') || (!price && html.match(/"amount"\s*:\s*\d+/) && html.includes('smallable'))) {
      try {
        const m = html.match(/"amount"\s*:\s*(\d+(?:\.\d+)?)/);
        if (m) price = m[1];
      } catch {}
    }
    // Generic JSON price in page source (covers Smallable and similar)
    if (!price) {
      const m = html.match(/"(?:price|amount|salePrice|currentPrice)"\s*:\s*"?(\d+(?:\.\d{1,2})?)"?/);
      if (m && parseFloat(m[1]) > 0) price = m[1];
    }

    // DOM price selectors (fallback for non-SSR pages)
    if (!price) {
      const selectors = [
        '[itemprop="price"]','[data-price]','[class*="sale-price" i]',
        '[class*="current-price" i]','[class*="product-price" i]','[class*="price__amount" i]',
        '[class*="price" i]',
      ];
      for (const sel of selectors) {
        for (const el of doc.querySelectorAll(sel)) {
          const txt = (el.getAttribute('data-price') || el.getAttribute('content') || el.textContent || '').trim();
          const m = txt.match(/[\$\€\£\¥]\s*(\d[\d,]*\.?\d{0,2})/);
          if (m) { price = m[1].replace(/,/g, ''); break; }
        }
        if (price) break;
      }
    }

    if (!title && !image) throw new Error('empty');
    return { title, image, price: price.replace(/[^0-9.]/g, ''), brand: brand.trim() };
  }

  // Parses the plain-text/Markdown response from r.jina.ai's Reader API — used
  // as a fallback source alongside the raw-HTML proxies. Jina renders the page
  // itself (like Microlink) so it gets past some bot walls the dumb HTML
  // proxies don't, but it hands back Markdown, not tags, so this needs its own
  // lightweight extraction rather than parseOgFromHtml's DOM-based one.
  function parseJinaMarkdown(text, baseUrl) {
    const titleMatch = text.match(/^Title:\s*(.*)$/m);
    const rawTitle = (titleMatch?.[1] || '').trim();
    if (isBlockedPage(text, rawTitle)) throw new Error('blocked');
    const title = cleanTitle(rawTitle);

    // First markdown image link that doesn't look like a logo/icon/tracking pixel
    let image = '';
    const imgRe = /!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g;
    let m;
    while ((m = imgRe.exec(text))) {
      const src = m[1];
      if (/logo|icon|sprite|favicon|avatar|placeholder|pixel|\.svg(\?|$)/i.test(src)) continue;
      image = src;
      break;
    }
    if (image && !image.startsWith('http')) {
      try { image = new URL(image, baseUrl).href; } catch {}
    }

    if (!title && !image) throw new Error('empty');
    // No price extraction here — Markdown has no structured price field, and a
    // wrong regex match would silently lock in a bad number (first source to
    // report a field wins). Other sources cover price when they succeed.
    return { title, image, price: '', brand: '' };
  }

  // Shared by every "paste a link" entry point. Kicks off Microlink + several
  // CORS-proxy/reader HTML fetches for a URL, each normalized to a common
  // { name, brand, img, price } shape. Callers merge fields across whichever
  // of these resolve — no single source is treated as authoritative, so a
  // proxy missing the image doesn't block another one from supplying it.
  function buildMetaSources(url, abort) {
    const urlMeta = parseUrlFallback(url);
    const stripBrandPrefix = (name, brand) => {
      if (!brand || !name) return name;
      const b = brand.toLowerCase();
      return name.toLowerCase().startsWith(b)
        ? name.slice(brand.length).replace(/^[\s,\-–—]+/, '').trim()
        : name;
    };
    // Microlink: renders JS, handles Cloudflare/SSENSE/etc.
    const normalizeMl = (ml) => {
      let name = stripBrandPrefix(cleanTitle(ml.title || ''), urlMeta?.brand || '');
      if (!name || /^\d+$/.test(name)) name = urlMeta?.name || name;
      const img = ml.image?.url || ml.screenshot?.url || '';
      const mlPrice = ml.price?.amount ?? ml.price ?? '';
      return { name, brand: urlMeta?.brand || '', img, price: mlPrice ? String(mlPrice).replace(/[^0-9.]/g, '') : '' };
    };
    // Raw HTML og:tag parse via a CORS proxy
    const normalizeHtml = (parsed) => {
      const brand = parsed.brand || urlMeta?.brand || '';
      return { name: stripBrandPrefix(parsed.title, brand), brand, img: parsed.image || '', price: parsed.price || '' };
    };

    const mlPromise = fetch(
      `https://api.microlink.io/?url=${encodeURIComponent(url)}&palette=false&audio=false&video=false&iframe=false`,
      { signal: abort.signal }
    ).then(async r => {
      const ml = await r.json();
      if (ml.status !== 'success') throw new Error('ml-fail');
      // Microlink's own request succeeding doesn't mean the target page did —
      // a 404/redirect-to-homepage/soft-block still reports status:'success'
      // with whatever page it landed on (e.g. Depop 404s to its own homepage).
      const code = ml.data?.statusCode;
      if (code != null && (code < 200 || code >= 400)) throw new Error('bad-status');
      if (isBlockedPage('', ml.data.title || '')) throw new Error('blocked');
      return normalizeMl(ml.data);
    });

    const proxyFetch = (fetchPromise) => fetchPromise.then(res => normalizeHtml(parseOgFromHtml(res.html, url)));

    const htmlProxies = [
      proxyFetch(
        fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, { signal: abort.signal })
          .then(r => r.json()).then(j => ({ html: j.contents || '' }))
      ),
      proxyFetch(
        fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, { signal: abort.signal })
          .then(r => { if (!r.ok) throw new Error('http-' + r.status); return r.text(); })
          .then(h => ({ html: h }))
      ),
      // r.jina.ai: renders the page like a real browser (like Microlink) rather
      // than a dumb server-side GET, so it gets past some bot walls the two
      // proxies above don't — but hands back Markdown, so it needs its own parser.
      fetch(`https://r.jina.ai/${url}`, { signal: abort.signal })
        .then(r => { if (!r.ok) throw new Error('http-' + r.status); return r.text(); })
        .then(text => normalizeHtml(parseJinaMarkdown(text, url))),
    ];

    return { urlMeta, allSources: [mlPromise, ...htmlProxies] };
  }

  // The add-item form is always on screen now (no separate blocking "fetching"
  // step) — every update below has to be a direct DOM patch rather than a full
  // render(), or it would blow away whatever the user is mid-typing elsewhere
  // in the form the moment a slower source resolves.
  async function fetchUrl() {
    const urlEl = document.getElementById('url-field');
    const rawUrl = urlEl ? urlEl.value.trim() : s.addForm.url;
    if (!rawUrl) { urlEl?.focus(); return; }
    try { new URL(rawUrl); } catch { showToast('Enter a valid URL first.'); return; }
    const url = cleanUrl(rawUrl);

    s.addForm.url = url;
    s.addForm.name = ''; s.addForm.brand = ''; s.addForm.img = ''; s.addForm.price = '';
    s.addForm.imgCandidates = [];
    s.addFetching = true;

    // Clear whatever's currently showing to match the fresh lookup — by hand,
    // since there's no full re-render to do it for us anymore.
    const nameEl = document.getElementById('f-name');
    const brandEl = document.getElementById('f-brand');
    const priceEl = document.getElementById('f-price');
    if (nameEl) nameEl.value = '';
    if (brandEl) brandEl.value = '';
    if (priceEl) { priceEl.value = '0.00'; priceEl.dataset.cents = '0'; }
    liveUpdateImg('');
    renderImgCandidates();
    const statusEl = document.getElementById('form-fetch-status');
    if (statusEl) statusEl.style.display = '';

    // Analytics: log the domain (never the full URL)
    try {
      const domain = new URL(url).hostname.replace(/^www\./, '');
      if (typeof gtag === 'function') gtag('event', 'url_lookup', { domain });
    } catch {};

    const abort = new AbortController();
    const masterTimer = setTimeout(() => abort.abort(), 14000);
    const { urlMeta, allSources } = buildMetaSources(url, abort);

    let bgTriggered = false;
    let gotAny = false;

    // First source to report name/brand/price wins; later sources only fill in
    // whatever's still missing. Images are different — every distinct image any
    // source finds gets added as a candidate (first one auto-selected), so a
    // wrong auto-pick is a tap to fix instead of a download/re-upload round trip.
    const patchField = (field, value) => {
      if (field === 'price') {
        const el = document.getElementById('f-price');
        if (el && el.dataset.cents && el.dataset.cents !== '0') return false;
        s.addForm.price = value;
        if (el) {
          const cents = Math.round(parseFloat(value || 0) * 100);
          el.value = (cents / 100).toFixed(2);
          el.dataset.cents = String(cents);
        }
        return true;
      }
      const el = document.getElementById(field === 'name' ? 'f-name' : 'f-brand');
      if (el && el.value.trim() !== '') return false;
      s.addForm[field] = value;
      if (el) el.value = value;
      return true;
    };

    const applyResult = (data) => {
      let changed = false;
      ['name', 'brand', 'price'].forEach(field => {
        if (data[field] && patchField(field, data[field])) changed = true;
      });
      if (data.img && addImgCandidate(data.img)) changed = true;
      if (changed) gotAny = true;
      if (s.addForm.img && !bgTriggered) {
        bgTriggered = true;
        autoRemoveBgIfWhite();
      }
    };

    allSources.forEach(p => p.then(applyResult).catch(() => {}));
    await Promise.allSettled(allSources);
    clearTimeout(masterTimer);
    s.addFetching = false;
    if (statusEl) statusEl.style.display = 'none';

    if (!gotAny) {
      if (urlMeta?.name) patchField('name', urlMeta.name);
      if (urlMeta?.brand) patchField('brand', urlMeta.brand);
      if (urlMeta?.img) addImgCandidate(urlMeta.img);
      showToast(urlMeta?.name
        ? 'Site blocked auto-fetch — check name and add image.'
        : "Couldn't fetch — fill in manually.");
      return;
    }

    // Every source failed to find one or more fields — fall back to whatever
    // can be derived from the URL itself for the remaining gaps.
    ['name', 'brand'].forEach(field => {
      if (s.addForm[field] || !urlMeta?.[field]) return;
      patchField(field, urlMeta[field]);
    });
    if (!s.addForm.img && urlMeta?.img) addImgCandidate(urlMeta.img);
    if (!bgTriggered && s.addForm.img) { bgTriggered = true; autoRemoveBgIfWhite(); }
  }

  // Adds a distinct image URL to the candidate strip; auto-selects it as the
  // main image if it's the first one found. Returns true if it was new.
  function addImgCandidate(url) {
    const cands = s.addForm.imgCandidates || (s.addForm.imgCandidates = []);
    if (cands.includes(url)) return false;
    cands.push(url);
    if (!s.addForm.img) liveUpdateImg(url);
    renderImgCandidates();
    return true;
  }

  function renderImgCandidates() {
    const wrap = document.getElementById('form-img-candidates');
    if (!wrap) return;
    const cands = s.addForm.imgCandidates || [];
    if (cands.length < 2) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
    wrap.style.display = '';
    wrap.innerHTML = cands.map(url => `
      <button type="button" class="form-img-cand ${url===s.addForm.img?'active':''}" data-src="${esc(url)}" onclick="selectImgCandidate(this)">
        <img src="${esc(url)}" alt="" />
      </button>`).join('');
  }

  function selectImgCandidate(btn) {
    const url = btn.getAttribute('data-src');
    liveUpdateImg(url);
    document.querySelectorAll('.form-img-cand').forEach(b => b.classList.toggle('active', b.getAttribute('data-src') === url));
  }

  function liveUpdateImg(url) {
    const el = document.getElementById('form-img-preview');
    if (!el) return;
    if (url) {
      if (el.tagName === 'IMG') {
        el.src = url;
      } else {
        el.insertAdjacentHTML('beforebegin', `<img src="${url}" alt="" id="form-img-preview" />`);
        el.remove();
      }
    } else if (el.tagName === 'IMG') {
      el.insertAdjacentHTML('beforebegin', `<div class="ph-lg" id="form-img-preview">No image found</div>`);
      el.remove();
    }
    const btnRow = document.getElementById('form-image-btn-row');
    if (btnRow) btnRow.style.display = url ? '' : 'none';
    s.addForm.img = url;
  }

  // ── Swipe-to-act (Delete / Purchase) ──────────────────────────────
  let _openSwipeWrap = null;

  function _closeOpenSwipe() {
    if (!_openSwipeWrap) return;
    const inner = _openSwipeWrap.querySelector('.swipe-inner');
    if (inner) {
      inner.style.transition = 'transform 0.3s cubic-bezier(0.16,1,0.3,1)';
      inner.style.transform = '';
      setTimeout(() => { inner.style.transition = ''; }, 300);
    }
    _openSwipeWrap = null;
  }

  function swipeRowStart(e, itemId) {
    if (e.target.closest('.list-drag-handle')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // Let button taps fall through to their onclick handlers
    if (e.target.closest('.swipe-act-btn')) return;

    const wrap = e.currentTarget;

    // Tap on any row while another is open → close the open one, don't start swipe
    if (_openSwipeWrap && _openSwipeWrap !== wrap) {
      _closeOpenSwipe();
      return;
    }
    // Tap on the already-open row's inner area → close it
    if (_openSwipeWrap === wrap) {
      _closeOpenSwipe();
      return;
    }

    const inner = wrap.querySelector('.swipe-inner');
    const startX = e.clientX;
    const startY = e.clientY;
    const SNAP = 160;                                   // px — width of both buttons combined
    const FULL = Math.min(window.innerWidth * 0.65, 280); // px — full-swipe auto-deletes
    let decided = false, isSwipe = false, dx = 0;

    function onMove(ev) {
      const x = ev.clientX - startX;
      const y = ev.clientY - startY;
      if (!decided) {
        if (Math.abs(x) < 5 && Math.abs(y) < 5) return;
        if (Math.abs(y) >= Math.abs(x)) { cleanup(); return; }
        decided = true; isSwipe = true;
      }
      if (!isSwipe) return;
      ev.preventDefault();
      dx = Math.min(0, x);
      inner.style.transform = `translateX(${dx}px)`;
    }

    function onUp() {
      cleanup();
      if (!isSwipe || dx === 0) return;
      if (dx <= -FULL) {
        // Full swipe → animate off then delete
        inner.style.transition = 'transform 0.2s ease-in';
        inner.style.transform = 'translateX(-110vw)';
        const h = wrap.offsetHeight;
        wrap.style.overflow = 'hidden';
        wrap.style.maxHeight = h + 'px';
        requestAnimationFrame(() => {
          wrap.style.transition = 'max-height 0.22s ease 0.12s, opacity 0.18s ease 0.12s';
          wrap.style.maxHeight = '0';
          wrap.style.opacity = '0';
        });
        setTimeout(() => swipeDeleteItem(itemId), 350);
      } else if (dx <= -(SNAP / 2)) {
        // Partial swipe → snap open to show buttons
        inner.style.transition = 'transform 0.3s cubic-bezier(0.16,1,0.3,1)';
        inner.style.transform = `translateX(-${SNAP}px)`;
        setTimeout(() => { inner.style.transition = ''; }, 300);
        _openSwipeWrap = wrap;
      } else {
        // Not far enough → snap back
        inner.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1)';
        inner.style.transform = '';
        setTimeout(() => { inner.style.transition = ''; }, 350);
      }
    }

    function cleanup() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }

    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // A raw camera-roll photo can be several MB at full resolution — reading it
  // straight into localStorage (as every file-upload path here used to do) is
  // the single biggest way to blow the storage quota and lose data. Every
  // upload goes through this cap first, no exceptions.
  function capImageFile(file, maxDim = 1000) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        const raw = e.target.result;
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
          if (scale >= 1) { resolve(raw); return; }
          try {
            const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/webp', 0.88));
          } catch { resolve(raw); }
        };
        img.onerror = () => resolve(raw);
        img.src = raw;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  async function autoRemoveBgIfWhite() {
    const src = s.addForm.img;
    if (!src || s.removingBg) return;

    try {
      let imgSrc = src;

      if (!src.startsWith('data:')) {
        // External URL — fetch via proxy first
        const proxies = [
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(src),
          'https://wsrv.nl/?url=' + encodeURIComponent(src),
        ];
        let dataUrl = null;
        for (const proxy of proxies) {
          try {
            const resp = await fetch(proxy, { signal: AbortSignal.timeout(7000) });
            if (resp.ok) {
              const blob = await resp.blob();
              dataUrl = await new Promise((res, rej) => {
                const reader = new FileReader();
                reader.onload = () => res(reader.result);
                reader.onerror = rej;
                reader.readAsDataURL(blob);
              });
              break;
            }
          } catch {}
        }
        if (!dataUrl) return;
        imgSrc = dataUrl;
      }

      const img = await new Promise((resolve, reject) => {
        const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = imgSrc;
      });

      const S = 80;
      const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, S, S);
      const { data } = ctx.getImageData(0, 0, S, S);

      const sample = (x, y) => { const i=(y*S+x)*4; return { r:data[i], g:data[i+1], b:data[i+2], a:data[i+3] }; };

      // If image already has meaningful transparency, background was already removed
      let transparentCount = 0;
      const totalPixels = S * S;
      for (let k = 0; k < data.length; k += 4) {
        if (data[k + 3] < 128) transparentCount++;
      }
      if (transparentCount / totalPixels > 0.05) return;

      // Sample the full perimeter at intervals — more robust against JPEG compression artifacts
      const edgeSamples = [];
      for (let x = 0; x < S; x += 3) {
        edgeSamples.push(sample(x, 0));
        edgeSamples.push(sample(x, S-1));
      }
      for (let y = 3; y < S-3; y += 3) {
        edgeSamples.push(sample(0, y));
        edgeSamples.push(sample(S-1, y));
      }

      // Skip if any edge pixel is transparent (already-cut-out PNG)
      if (edgeSamples.some(p => p.a < 200)) return;

      // Solid background check: ≥80% of edge samples within color distance 45 of their average
      const avg = edgeSamples.reduce((a, p) => ({ r: a.r+p.r, g: a.g+p.g, b: a.b+p.b }), { r:0, g:0, b:0 });
      avg.r /= edgeSamples.length; avg.g /= edgeSamples.length; avg.b /= edgeSamples.length;
      const colorDist = p => Math.sqrt((p.r-avg.r)**2 + (p.g-avg.g)**2 + (p.b-avg.b)**2);
      const consistent = edgeSamples.filter(p => colorDist(p) < 45).length;
      if (consistent / edgeSamples.length < 0.80) return;

      if (s.addForm.img === src) {
        s.addForm.img = imgSrc;
        await removeItemBackground();
      }
    } catch {}
  }

  async function removeItemBackground() {
    const src = s.addForm.img;
    if (!src || s.removingBg) return;

    s.removingBg = true;
    render();
    // Yield so the browser paints "Removing..." before the heavy canvas work
    await new Promise(r => setTimeout(r, 0));

    try {
      // For external URLs, fetch through a proxy to get a data: URL we can draw on canvas
      let imgSrc = src;
      if (!src.startsWith('data:')) {
        const proxies = [
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(src),
          'https://wsrv.nl/?url=' + encodeURIComponent(src),
        ];
        for (const proxy of proxies) {
          try {
            const resp = await fetch(proxy, { signal: AbortSignal.timeout(6000) });
            if (resp.ok) {
              const blob = await resp.blob();
              imgSrc = await new Promise((res, rej) => {
                const reader = new FileReader();
                reader.onload = () => res(reader.result);
                reader.onerror = rej;
                reader.readAsDataURL(blob);
              });
              break;
            }
          } catch {}
        }
      }

      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = imgSrc;
      });

      // Cap dimensions before processing — source product photos can be huge,
      // and an uncapped PNG data URL stored in localStorage is how items and
      // boards silently blow past the storage quota (saves then fail quietly).
      const MAX_DIM = 1000;
      const srcScale = Math.min(1, MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
      const W = Math.round(img.naturalWidth * srcScale), H = Math.round(img.naturalHeight * srcScale);
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, W, H);

      const imageData = ctx.getImageData(0, 0, W, H);
      const d = imageData.data;

      // Sample corners + edge midpoints to estimate background color robustly
      function px(x, y) { const i = (y*W+x)*4; return [d[i], d[i+1], d[i+2]]; }
      const samples = [
        px(0,0), px(W-1,0), px(0,H-1), px(W-1,H-1),
        px(Math.floor(W/2),0), px(Math.floor(W/2),H-1),
        px(0,Math.floor(H/2)), px(W-1,Math.floor(H/2)),
      ];
      const bg = samples.reduce((a,c) => [a[0]+c[0],a[1]+c[1],a[2]+c[2]], [0,0,0])
                        .map(v => Math.round(v/samples.length));

      // Two-zone threshold: hard remove (pure bg) + soft fade (shadows/gradients)
      const HARD = 30;   // fully transparent
      const SOFT = 90;   // BFS still propagates but alpha is blended

      function dist(i) {
        const dr=d[i]-bg[0], dg=d[i+1]-bg[1], db=d[i+2]-bg[2];
        return Math.sqrt(dr*dr+dg*dg+db*db);
      }

      const visited = new Uint8Array(W*H);
      const queue = new Int32Array(W*H*2);
      let head=0, tail=0;

      function enq(x,y) {
        const idx=y*W+x;
        if (!visited[idx]) { visited[idx]=1; queue[tail++]=x; queue[tail++]=y; }
      }
      for (let x=0; x<W; x++) { enq(x,0); enq(x,H-1); }
      for (let y=1; y<H-1; y++) { enq(0,y); enq(W-1,y); }

      while (head < tail) {
        const x=queue[head++], y=queue[head++];
        const pi=(y*W+x)*4;
        const dd=dist(pi);
        if (dd <= SOFT) {
          if (dd <= HARD) {
            // Pure background — fully transparent
            d[pi+3] = 0;
          } else {
            // Shadow/gradient zone — blend alpha proportionally
            const t = (dd - HARD) / (SOFT - HARD); // 0 = bg edge, 1 = product edge
            d[pi+3] = Math.round(d[pi+3] * t * t); // quadratic fade, bias toward transparent
          }
          // Continue BFS into neighbours
          if (x>0)   enq(x-1,y);
          if (x<W-1) enq(x+1,y);
          if (y>0)   enq(x,y-1);
          if (y<H-1) enq(x,y+1);
        }
      }

      ctx.putImageData(imageData, 0, 0);
      s.addForm.img = canvas.toDataURL('image/webp', 0.9);
      s.removingBg = false;
      render();
    } catch(err) {
      console.error('[Remove BG]', err);
      s.removingBg = false;
      render();
      showToast('Could not remove background.');
    }
  }

  function currencyKeydown(e, fieldId) {
    const passthrough = ['Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape'];
    if (passthrough.includes(e.key)) return;
    e.preventDefault();
    const field = e.target;
    let cents = parseInt(field.dataset.cents || '0', 10);
    if (e.key >= '0' && e.key <= '9') {
      cents = Math.min(cents * 10 + parseInt(e.key, 10), 9999999);
    } else if (e.key === 'Backspace') {
      cents = Math.floor(cents / 10);
    } else {
      return;
    }
    field.dataset.cents = cents;
    field.value = (cents / 100).toFixed(2);
    // Keep addForm in sync too — a pill picker elsewhere in the form (category,
    // wishlist) triggers a full render(), which would otherwise reset this
    // input back to whatever addForm still thinks the price is.
    const key = fieldId.replace(/^f-/, '');
    if (s.addForm && key in s.addForm) s.addForm[key] = String(cents / 100);
  }

  // Upload a data URL image to an anonymous host, return the HTTP URL or null
  async function uploadDataUrl(dataUrl) {
    if (!dataUrl || !dataUrl.startsWith('data:')) return null;
    try {
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const ext = blob.type.includes('png') ? 'png' : blob.type.includes('webp') ? 'webp' : 'jpg';
      // Primary: catbox.moe anonymous upload
      const form = new FormData();
      form.append('reqtype', 'fileupload');
      form.append('fileToUpload', blob, `img.${ext}`);
      const r = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: form });
      const url = (await r.text()).trim();
      if (url.startsWith('https://')) return url;
    } catch {}
    try {
      // Fallback: 0x0.st
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const form = new FormData();
      form.append('file', blob, 'img.jpg');
      const r = await fetch('https://0x0.st', { method: 'POST', body: form });
      const url = (await r.text()).trim();
      if (url.startsWith('http')) return url;
    } catch {}
    return null;
  }

  async function shareWishlist(wid, perm = 'view') {
    const wl = getWl(wid);
    if (!wl) return;
    const wItems = watchingItems(wid);
    const senderName = getUserName();
    const shareTitle = senderName ? `${senderName}'s List` : wl.name;

    // ── Build share URL — only http images included (no network calls before
    // navigator.share). CompressionStream is local so it's safe to await here;
    // it completes in <5ms and doesn't consume the iOS user-gesture activation
    // the way a network fetch would.
    const payload = {
      v: 1,
      senderName,
      perm: perm || 'view',
      wl: { name: wl.name, coverImg: wl.coverImg?.startsWith('http') ? wl.coverImg : '' },
      items: wItems.map(i => ({
        name: i.name, brand: i.brand || '',
        img: i.img?.startsWith('http') ? i.img : '',
        price: i.price || '', url: i.url || '',
        tags: i.tags || [], note: i.note || '', addedAt: i.addedAt
      }))
    };
    const encoded = await encodeShare(payload);
    const shareUrl = location.href.split('#')[0] + '#share=' + encoded;

    if (navigator.share) {
      try {
        await navigator.share({
          title: shareTitle,
          text: `${shareTitle} — check it out`,
          url: shareUrl,
        });
        if (typeof gtag === 'function') gtag('event', 'share_wishlist', { method: 'native_share', item_count: wItems.length });
      } catch (e) {
        if (e.name !== 'AbortError') showToast('Could not share.');
      }
    } else {
      try {
        await navigator.clipboard.writeText(shareUrl);
        showToast('Link copied.');
        if (typeof gtag === 'function') gtag('event', 'share_wishlist', { method: 'clipboard', item_count: wItems.length });
      } catch {
        showToast('Could not copy link.');
      }
    }

    // ── Background: upload any data: images so future shares include them ──
    const hasDataUrls = wl.coverImg?.startsWith('data:') || wItems.some(i => i.img?.startsWith('data:'));
    if (hasDataUrls) {
      const resolveImg = async (img) => {
        if (!img || img.startsWith('http')) return img || '';
        if (img.startsWith('data:')) return (await uploadDataUrl(img)) || '';
        return '';
      };
      const [coverHosted, ...itemHosted] = await Promise.all([
        resolveImg(wl.coverImg),
        ...wItems.map(i => resolveImg(i.img))
      ]);
      let changed = false;
      wItems.forEach((item, idx) => {
        const h = itemHosted[idx];
        if (h?.startsWith('http') && item.img !== h) {
          items = items.map(x => x.id === item.id ? { ...x, img: h } : x);
          changed = true;
        }
      });
      if (coverHosted?.startsWith('http') && wl.coverImg !== coverHosted) {
        wishlists = wishlists.map(w => w.id === wl.id ? { ...w, coverImg: coverHosted } : w);
        changed = true;
      }
      if (changed) saveData();
    }
  }

  // Auto-crop whitespace/transparent padding from product thumbnails
  function smartCropThumb(imgEl) {
    if (!imgEl?.complete || !imgEl.naturalWidth) return;
    const tryAnalyze = (source) => {
      try {
        const S = 100;
        const cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(source, 0, 0, S, S);
        const { data } = ctx.getImageData(0, 0, S, S);
        let x0=S, x1=0, y0=S, y1=0, found=false;
        for (let y=0; y<S; y++) for (let x=0; x<S; x++) {
          const i=(y*S+x)*4, a=data[i+3], r=data[i], g=data[i+1], b=data[i+2];
          if (a < 20 || (r > 240 && g > 240 && b > 240)) continue;
          if (x<x0) x0=x; if (x>x1) x1=x;
          if (y<y0) y0=y; if (y>y1) y1=y;
          found=true;
        }
        if (!found) return;
        const P=5; // padding pixels in analysis space
        x0=Math.max(0,x0-P); y0=Math.max(0,y0-P);
        x1=Math.min(S-1,x1+P); y1=Math.min(S-1,y1+P);
        const t=y0/S, r=(S-1-x1)/S, b=(S-1-y1)/S, l=x0/S;
        if (Math.max(t,r,b,l) < 0.07) return; // not enough padding to bother
        imgEl.style.objectViewBox=`inset(${(t*100).toFixed(1)}% ${(r*100).toFixed(1)}% ${(b*100).toFixed(1)}% ${(l*100).toFixed(1)}%)`;
      } catch(e) {}
    };
    if (imgEl.src.startsWith('data:')) {
      tryAnalyze(imgEl);
    } else {
      // Try CORS-enabled analysis for external URLs
      const probe = new Image();
      probe.crossOrigin = 'anonymous';
      probe.onload = () => tryAnalyze(probe);
      probe.onerror = () => {};
      probe.src = imgEl.src + (imgEl.src.includes('?') ? '&' : '?') + '_crop=1';
    }
  }

  async function removeImageBackground(imgSrc) {
    let src = imgSrc;
    if (!src.startsWith('data:')) {
      const proxies = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(src),
        'https://wsrv.nl/?url=' + encodeURIComponent(src),
      ];
      for (const proxy of proxies) {
        try {
          const resp = await fetch(proxy, { signal: AbortSignal.timeout(6000) });
          if (resp.ok) {
            const blob = await resp.blob();
            src = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.onerror = rej;
              r.readAsDataURL(blob);
            });
            break;
          }
        } catch {}
      }
    }
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = src;
    });
    // Cap dimensions before processing — see removeItemBackground for why.
    const MAX_DIM = 1000;
    const srcScale = Math.min(1, MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
    const W = Math.round(img.naturalWidth * srcScale), H = Math.round(img.naturalHeight * srcScale);
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, W, H);
    const imageData = ctx.getImageData(0, 0, W, H);
    const d = imageData.data;
    function px(x, y) { const i = (y*W+x)*4; return [d[i], d[i+1], d[i+2]]; }
    const samples = [px(0,0),px(W-1,0),px(0,H-1),px(W-1,H-1),px(Math.floor(W/2),0),px(Math.floor(W/2),H-1),px(0,Math.floor(H/2)),px(W-1,Math.floor(H/2))];
    const bg = samples.reduce((a,c) => [a[0]+c[0],a[1]+c[1],a[2]+c[2]], [0,0,0]).map(v => Math.round(v/samples.length));
    const HARD = 30, SOFT = 90;
    function dist(i) { const dr=d[i]-bg[0],dg=d[i+1]-bg[1],db=d[i+2]-bg[2]; return Math.sqrt(dr*dr+dg*dg+db*db); }
    const visited = new Uint8Array(W*H);
    const queue = new Int32Array(W*H*2);
    let head=0, tail=0;
    function enq(x,y) { const qi=y*W+x; if (!visited[qi]) { visited[qi]=1; queue[tail++]=x; queue[tail++]=y; } }
    for (let x=0; x<W; x++) { enq(x,0); enq(x,H-1); }
    for (let y=1; y<H-1; y++) { enq(0,y); enq(W-1,y); }
    while (head < tail) {
      const x=queue[head++], y=queue[head++];
      const pi=(y*W+x)*4;
      const dd=dist(pi);
      if (dd <= SOFT) {
        d[pi+3] = dd <= HARD ? 0 : Math.round(d[pi+3] * ((dd-HARD)/(SOFT-HARD)) ** 2);
        if (x>0) enq(x-1,y); if (x<W-1) enq(x+1,y);
        if (y>0) enq(x,y-1); if (y<H-1) enq(x,y+1);
      }
    }
    ctx.putImageData(imageData, 0, 0);

    // Tight-crop to visible pixels
    const rd = ctx.getImageData(0, 0, W, H).data;
    let minX = W, maxX = 0, minY = H, maxY = 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (rd[(y * W + x) * 4 + 3] > 10) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (minX > maxX || minY > maxY) return canvas.toDataURL('image/webp', 0.9);

    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;
    const pad = Math.round(Math.max(cropW, cropH) * 0.08);
    const size = Math.max(cropW, cropH) + pad * 2;
    const out = document.createElement('canvas');
    out.width = size; out.height = size;
    const octx = out.getContext('2d');
    octx.drawImage(canvas, minX, minY, cropW, cropH,
      Math.round((size - cropW) / 2), Math.round((size - cropH) / 2), cropW, cropH);
    return out.toDataURL('image/webp', 0.9);
  }


  function openBoardShare(boardId) {
    s.currentBoardId = boardId;
    s.boardSharePerm = 'view';
    s.overlay = 'board-share';
    render();
  }

  function closeBoardShare() {
    s.overlay = null;
    render();

  async function shareBoardFn(boardId) {
    const board = boards.find(b => b.id === boardId);
    if (!board) return;
    const perm = s.boardSharePerm || 'view';
    closeBoardShare();

    if (perm === 'view') {
      if (!board.img) { showToast('No image to share.'); return; }
      try {
        const blob = await (await fetch(board.img)).blob();
        const file = new File([blob], 'board.jpg', { type: 'image/jpeg' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else if (navigator.share) {
          await navigator.share({ title: 'Board', url: location.href });
        } else {
          const a = document.createElement('a');
          a.href = board.img; a.download = 'board.jpg'; a.click();
          showToast('Image downloaded.');
        }
      } catch (e) { if (e.name !== 'AbortError') showToast('Could not share.'); }
    } else {
      const payload = {
        perm: 'edit',
        stickers: (board.stickers || []).map(st => {
          const item = getItem(st.itemId);
          return { img: item?.img?.startsWith('http') ? item.img : '', x: st.x, y: st.y, w: st.w, h: st.h };
        })
      };
      const encoded = await encodeBoardShare(payload);
      const url = location.href.split('#')[0] + '#board=' + encoded;
      if (navigator.share) {
        try { await navigator.share({ title: 'Board', url }); }
        catch (e) { if (e.name !== 'AbortError') showToast('Could not share.'); }
      } else {
        try { await navigator.clipboard.writeText(url); showToast('Link copied.'); }
        catch { showToast('Could not copy link.'); }
      }
    }
  }

  async function encodeBoardShare(payload) {
    const json = JSON.stringify(payload);
    if (typeof CompressionStream !== 'undefined') {
      try {
        const cs = new CompressionStream('deflate-raw');
        const w = cs.writable.getWriter(); w.write(new TextEncoder().encode(json)); w.close();
        const r = cs.readable.getReader(); const chunks = [];
        while (true) { const { done, value } = await r.read(); if (done) break; chunks.push(value); }
        const buf = new Uint8Array(chunks.reduce((s,c)=>s+c.length,0));
        let off=0; for (const c of chunks) { buf.set(c,off); off+=c.length; }
        return 'z' + btoa(String.fromCharCode(...buf)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
      } catch {}
    }
    return btoa(unescape(encodeURIComponent(json)));
  }

  async function decodeBoardShare(str) {
    try {
      if (str.startsWith('z') && typeof DecompressionStream !== 'undefined') {
        const b64 = str.slice(1).replace(/-/g,'+').replace(/_/g,'/');
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const ds = new DecompressionStream('deflate-raw');
        const w = ds.writable.getWriter(); w.write(bytes); w.close();
        const r = ds.readable.getReader(); const chunks = [];
        while (true) { const { done, value } = await r.read(); if (done) break; chunks.push(value); }
        const buf = new Uint8Array(chunks.reduce((s,c)=>s+c.length,0));
        let off=0; for (const c of chunks) { buf.set(c,off); off+=c.length; }
        return JSON.parse(new TextDecoder().decode(buf));
      }
      return JSON.parse(decodeURIComponent(escape(atob(str))));
    } catch { return null; }
  }

  function openBoardEditor(boardId, fromDetail) {
    _boardFromDetail = !!fromDetail;
    if (boardId) {
      const board = boards.find(b => b.id === boardId);
      if (!board) return;
      _boardEditId = boardId;
      _boardName = board.name;
      const rawStickers = board.stickers || [];
      // A sticker whose item no longer exists (e.g. lost to a past storage-full
      // save failure) can't render anything — drop it instead of keeping a
      // blank tile that silently vanishes from the board again on next save.
      _boardStickers = rawStickers.map(st => {
        const item = getItem(st.itemId);
        if (!item) return null;
        const sticker = { itemId: st.itemId, img: item.img || '', name: item.name || '', x: st.x, y: st.y, w: st.w, h: st.h, aspect: st.w / st.h };
        if (item.img) {
          const _img = new Image();
          _img.onload = () => {
            if (_img.naturalWidth && _img.naturalHeight) {
              sticker.aspect = _img.naturalWidth / _img.naturalHeight;
            }
          };
          _img.src = item.img;
        }
        return sticker;
      }).filter(Boolean);
      const droppedCount = rawStickers.length - _boardStickers.length;
      if (droppedCount > 0) {
        showToast(`${droppedCount} item${droppedCount===1?'':'s'} no longer available — removed from this board.`);
      }
    } else {
      _boardEditId = null;
      _boardName = 'My Board';
      _boardStickers = [];
    }
    _boardDrag = null;
    _bePanelFilterWids = [];
    _bePanelFilterTags = [];
    s.screen = 'board-editor';
    render();
  }

  function cancelBoardEdit() {
    _boardDrag = null;

    document.removeEventListener('pointerup', _onBoardUp);
    document.removeEventListener('pointercancel', _onBoardUp);
    if (_boardFromWid) {
      s.screen = 'wishlist-detail';
      s.currentWid = _boardFromWid;

    } else if (_boardFromDetail) {
      s.screen = 'board-detail';
      _boardFromDetail = false;
    } else {
      s.screen = 'boards';
    }
    render();
  }

    } else {
      _bePanelFilterWids = _bePanelFilterWids.includes(wid)
        ? _bePanelFilterWids.filter(w => w !== wid)
        : [..._bePanelFilterWids, wid];

  function boardPanelToggleTag(tag) {
    _bePanelFilterTags = _bePanelFilterTags.includes(tag)
      ? _bePanelFilterTags.filter(t => t !== tag)
      : [..._bePanelFilterTags, tag];
