  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Curate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #0264FD; }
    button, a { -webkit-tap-highlight-color: transparent; outline: none; }
    *:focus { outline: none; }
    *:focus-visible { outline: none; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }

    /* ─── App root ─── */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      overflow: hidden;
    }

    /* ─── Safe areas ─── */
    .safe-top {
      height: env(safe-area-inset-top, 44px);
      min-height: 44px;
      flex-shrink: 0;
    }
    .safe-bottom {
      height: max(env(safe-area-inset-bottom), 8px);
      flex-shrink: 0;
    }

    /* ─── Header ─── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
      min-height: 44px;
    }
    .h-left, .h-right {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      color: #000;
      padding: 4px 0;
      line-height: 1;
    }
    .h-right { text-align: right; }
    .h-muted { color: #bbb !important; }

    /* ─── Home screen header ─── */
    .home-profile-btn {
      width: 32px; height: 32px;
      background: #efefef;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    /* Matches .sub-tab-bar's natural height (35px) so Boards/Stats empty
       states center at the same spot as Items/Lists — see .safe-top pairing
       in minimalHeader(). */
    .minimal-hdr {
      height: 35px;
      flex-shrink: 0;
    }

    /* ─── Home nav (left pill tabs + right FAB) ─── */
    .home-nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }
    .home-tab-pill {
      display: flex;
      border-radius: 50px;
      background: var(--accent);
      border: none;
      overflow: hidden;
      box-shadow: none;
    }
    .home-tab-btn {
      width: 48px; height: 48px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: none; border: none; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      opacity: 0.5;
      transition: opacity 0.14s ease;
    }
    .home-tab-btn.active { opacity: 1; }
    .home-tab-btn svg { display: block; }
    .home-fab-btn {
      width: 48px; height: 48px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, opacity 0.12s ease;
      box-shadow: none;
    }
    .home-fab-btn:active { transform: scale(0.91); opacity: 0.85; }

    /* ─── Home wishlist editorial rows ─── */
    .home-wl-row {
      display: flex; align-items: stretch;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      min-height: 110px;
    }
    .home-wl-row:active { background: #fafafa; }
    .home-wl-row-img {
      width: 42vw; max-width: 175px; flex-shrink: 0;
      overflow: hidden; background: #f5f5f5;
    }
    .home-wl-row-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .home-wl-row-info {
      flex: 1; min-width: 0;
      padding: 14px 16px 14px 16px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .home-wl-row-meta {
      font-size: 11px; color: #aaa; margin-bottom: 6px;
      text-transform: none; letter-spacing: 0;
    }
    .home-wl-row-name {
      font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;
      color: #000;
    }
    .home-wl-row-desc {
      font-size: 12px; color: #999; margin-top: 5px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; font-weight: 400;
    }
    .home-wl-row-edit-btn {
      position: absolute; top: 10px; right: 10px;
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer; color: #bbb;
      -webkit-tap-highlight-color: transparent; font-size: 18px; line-height: 1;
      letter-spacing: 1px;
    }
    .home-wl-row-img .wl-collage { width: 100%; height: 100%; }
    .home-wl-row-img .wl-collage img { object-fit: cover; background: #f5f5f5; }

    /* ─── Bottom nav ─── */
    .bottom-nav {
      display: flex;
      flex-shrink: 0;
      margin: 6px 14px;
      margin-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      border-radius: 50px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(40px) saturate(160%);
      -webkit-backdrop-filter: blur(40px) saturate(160%);
      border: none;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.05),
        0 2px 18px rgba(0,0,0,0.09),
        0 1px 4px rgba(0,0,0,0.06),
        inset 0 1.5px 0 rgba(255,255,255,1),
        inset 0 -0.5px 0 rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 11px 0 10px;
      gap: 4px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-tab span {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #aaa;
    }
    .nav-tab.active span { color: #000; }
    .nav-dot { width: 4px; height: 4px; background: #000; border-radius: 50%; }

    /* ─── Sub-tab bar (Items / Category / Lists) ─── */
    .sub-tab-bar {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
      background: #fff;
      flex-shrink: 0;
    }
    .sub-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 11px 0;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .sub-tab span {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #bbb;
    }
    .sub-tab.active span { color: #000; }
    .sub-tab-profile-btn {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      width: 44px; padding: 11px 14px 11px 0;
      background: none; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes wlSlideFromRight { from { transform: translateX(100%); opacity: 0.6; } to { transform: translateX(0); opacity: 1; } }
    @keyframes wlSlideFromLeft  { from { transform: translateX(-100%); opacity: 0.6; } to { transform: translateX(0); opacity: 1; } }
    .wl-slide-from-right { animation: wlSlideFromRight 0.42s cubic-bezier(0.4,0,0.2,1) both; }
    .wl-slide-from-left  { animation: wlSlideFromLeft  0.42s cubic-bezier(0.4,0,0.2,1) both; }

    /* ─── Filter control bar ─── */
    .filter-control-bar {
      display: flex; align-items: stretch; border-bottom: 1px solid #f4f4f4;
      background: #fff; flex-shrink: 0; min-height: 40px; position: relative;
    }
    .filter-pills-scroll {
      flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding: 8px 12px; touch-action: pan-x; align-items: center;
    }
    .filter-pills-scroll::-webkit-scrollbar { display: none; }

    /* ─── Scroll areas ─── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    /* When a .scroll-area's only content is an .empty-state, this makes that
       state truly vertically center in the remaining space — so "nothing here
       yet" / "no boards yet" / "no data yet" all land in the same spot
       regardless of how tall the header above them is. */
    .scroll-area-empty {
      display: flex;
      flex-direction: column;
    }

    /* ─── Grid ─── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      background: #fff;
      width: 100%;
      box-sizing: border-box;
    }
    .card {
      min-width: 0;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
    }
    .card:active { opacity: 0.8; }
    .card-image {
      aspect-ratio: 1 / 1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-image img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .card-image .ph {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d0d0d0;
      padding: 12px;
      text-align: center;
      line-height: 1.5;
    }
    .card-meta { padding: 8px 10px 10px; }
    .card-prefix {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }
    .card-days { font-size: 10px; letter-spacing: 0.1em; color: #ccc; }
    .card-name {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #000;
    }
    .card-price {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #bbb;
      margin-top: 2px;
    }

    /* ─── FAB (floating + button) ─── */
    .fab {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 54px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(40px) saturate(160%);
      -webkit-backdrop-filter: blur(40px) saturate(160%);
      border: none;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.05),
        0 2px 18px rgba(0,0,0,0.09),
        0 1px 4px rgba(0,0,0,0.06),
        inset 0 1.5px 0 rgba(255,255,255,1),
        inset 0 -0.5px 0 rgba(0,0,0,0.04);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 200;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }
    .fab:active { transform: translateX(-50%) scale(0.91); box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
    .fab svg { display: block; }

    /* ─── Shared wishlist footer ─── */
    .shared-footer {
      padding: 28px 24px;
      text-align: center;
      border-top: 1px solid #f0f0f0;
    }

    /* ─── Wishlist folder cards ─── */
    .folder-label { font-size: 12px; letter-spacing: 0; font-weight: 600; color: #000; }
    .folder-count { font-size: 11px; letter-spacing: 0; text-transform: none; color: #aaa; margin-top: 2px; }
    .folder-initial {
      font-size: 32px;
      font-weight: 700;
      color: #e8e8e8;
      letter-spacing: -0.02em;
    }

    /* ─── Wishlist collage thumbnail ─── */
    .wl-collage {
      width: 100%; aspect-ratio: 1;
      display: grid; background: #f5f5f5;
      overflow: hidden; gap: 0;
    }
    .wl-collage img { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }
    .wl-collage-1 { grid-template-columns: 1fr; }
    .wl-collage-2 { grid-template-columns: 1fr 1fr; }
    .wl-collage-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .wl-collage-3 img:first-child { grid-row: 1 / 3; }
    .wl-collage-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* ─── Wishlist edit mode ─── */
    .card-editing {
      position: relative;
      cursor: grab;
      user-select: none;
    }
    .card-editing:active { cursor: grabbing; opacity: 0.55; }
    .card-drag-over { outline: 2px solid #000; outline-offset: -2px; }
    .wl-delete-btn {
      position: absolute;
      top: 0; right: 0;
      z-index: 10;
      width: 24px; height: 24px;
      background: #000;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 300; line-height: 1;
      cursor: pointer;
    }

    /* ─── Purchased item treatment ─── */
    .card-purchased .card-image .ph { color: #ddd; }
    .card-purchased .card-name { color: #ccc; }
    .card-purchased .card-days { color: #e0e0e0; }
    .card-purchased .card-price { color: #ddd; }
    .owned-badge {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 20px; height: 20px; border-radius: 50%;
      background: #000; display: flex; align-items: center; justify-content: center;
    }

    /* ─── Item delete button (edit mode within wishlist) ─── */
    .item-delete-btn {
      position: absolute;
      top: 0; left: 0;
      z-index: 10;
      width: 22px; height: 22px;
      background: #000;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 300; line-height: 1;
      cursor: pointer;
    }

    /* ─── Wishlist detail cover + sticky scroll ─── */
    .wl-detail-scroll {
      flex: 1;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    .wl-cover-wrap {
      width: 100%;
      height: 230px;
      position: sticky;
      top: 0;
      overflow: hidden;
      background: #ebebeb;
      flex-shrink: 0;
      z-index: 0;
    }
    .wl-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .wl-cover-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.18) 0%, transparent 40%, rgba(0,0,0,0.28) 100%);
      pointer-events: none;
    }
    .wl-edit-cover-btn {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.85);
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      color: #000;
    }
    .wl-cover-empty-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ccc;
    }
    .wl-content-wrap {
      position: relative;
      z-index: 2;
      background: #fff;
      margin-top: -1px;
    }
    .wl-sticky-top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .wl-name-row {
      padding: 12px 20px 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .wl-name-big {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: none;
      display: block;
      line-height: 1.1;
    }
    .wl-count-sm {
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      color: #aaa;
      display: block;
      margin-top: 3px;
      font-weight: 400;
    }

    /* ─── List view rows ─── */
    .list-view { width: 100%; }
    .swipe-row-wrap { overflow: hidden; }
    .swipe-inner { display: flex; align-items: stretch; }
    .swipe-inner > .list-row,
    .swipe-inner > .note-row { flex: 0 0 100%; overflow: hidden; }
    .swipe-act-btn {
      width: 80px; display: flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
      border: none; cursor: pointer; flex-shrink: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .swipe-act-purchase { background: var(--accent); color: #000; }
    .swipe-act-delete { background: #c0392b; color: #fff; }
    .swipe-act-wl-purchase { background: #222; color: #fff; }
    .swipe-act-restore { background: var(--accent); color: #fff; }
    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #f6f6f6;
      cursor: pointer;
      position: relative;
      user-select: none;
      background: #fff;
      z-index: 1;
    }
    .list-row:active { opacity: 0.75; }
    .list-drag-handle {
      color: #d0d0d0; font-size: 13px; flex-shrink: 0;
      cursor: grab; padding: 0 6px 0 0; touch-action: none; user-select: none;
    }
    .list-row.dragging {
      opacity: 0; pointer-events: none;
    }
    .list-row.drag-over-above {
      box-shadow: inset 0 2px 0 #000;
    }
    .list-row.drag-over-below {
      box-shadow: inset 0 -2px 0 #000;
    }
    .drag-ghost {
      position: fixed; z-index: 1000; pointer-events: none;
      background: #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.14);
      left: 0; width: 100%;
      transition: transform 0.08s ease;
    }
    .list-thumb {
      width: 48px; height: 48px;
      flex-shrink: 0; overflow: hidden; background: #fff;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
    .list-thumb .ph { font-size: 7px; letter-spacing: 0.06em; text-transform: uppercase; color: #d0d0d0; padding: 4px; text-align: center; line-height: 1.4; }
    .list-info { flex: 1; min-width: 0; }
    .list-name {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000;
    }
    .list-meta { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #bbb; margin-top: 2px; }
    .list-price { font-size: 10px; letter-spacing: 0.06em; color: #000; flex-shrink: 0; }

    /* ─── Notes-style item rows (wishlist detail) ─── */
    .note-row {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 16px;
      cursor: pointer; background: #fff; -webkit-tap-highlight-color: transparent;
      position: relative; z-index: 1;
    }
    .note-row:active { opacity: 0.72; }
    .note-thumb {
      width: 72px; height: 72px; flex-shrink: 0;
      overflow: hidden; border-radius: 14px; background: #fff;
    }
    .note-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; mix-blend-mode: multiply; }
    .note-thumb-ph { width: 100%; height: 100%; background: #ebebeb; border-radius: 14px; }
    .note-info { flex: 1; min-width: 0; }
    .note-name {
      font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000;
      line-height: 1.2;
    }
    .note-meta {
      font-size: 14px; font-weight: 400; letter-spacing: 0;
      color: #888; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-transform: none;
    }
    .note-date {
      font-size: 12px; font-weight: 400; color: #bbb; margin-top: 2px;
      text-transform: none; letter-spacing: 0;
    }
    .note-price {
      font-size: 13px; font-weight: 400; letter-spacing: 0;
      color: #888; flex-shrink: 0;
    }
    .note-row-purchased .note-name { color: #aaa; }
    .note-row-purchased .note-meta { color: #bbb; }
    .note-row-purchased .note-price { color: #ccc; }
    @keyframes noteShimmer {
      0% { background-position: -300px 0; }
      100% { background-position: calc(300px + 100%) 0; }
    }
    .note-skel {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 600px 100%;
      animation: noteShimmer 1.4s ease-in-out infinite;
      border-radius: 1px; display: block;
    }
    .note-thumb-skel { background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 600px 100%; animation: noteShimmer 1.4s ease-in-out infinite; }

    /* ─── Add item card (wishlist detail) ─── */
    /* ─── Change cover panel ─── */
    .cover-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      padding: 20px 20px 36px;
      z-index: 60;
    }
    .cover-panel-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 12px;
    }
    .cover-panel-preview {
      width: 100%;
      height: 100px;
      object-fit: cover;
      margin-bottom: 10px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cover-panel-preview img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── Section title row ─── */
    .section-title-row {
      padding: 14px 20px 12px;
      border-bottom: 1px solid #f4f4f4;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ─── Install Dialog (iOS native style) ─── */
    .install-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 20px);
      opacity: 0; transition: opacity 0.22s ease;
    }
    .install-overlay.is-open { opacity: 1; }
    .install-dialog {
      width: 100%; max-width: 360px;
      background: rgba(242,242,247,0.88);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.28), 0 0 0 0.5px rgba(255,255,255,0.3) inset;
      transform: translateY(32px) scale(0.97);
      transition: transform 0.32s cubic-bezier(0.16,1,0.3,1), opacity 0.22s ease;
      opacity: 0;
    }
    .install-overlay.is-open .install-dialog {
      transform: translateY(0) scale(1); opacity: 1;
    }
    /* Header row */
    .install-dlg-header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 18px 14px; position: relative;
    }
    .install-dlg-icon {
      width: 56px; height: 56px; background: var(--accent);
      border-radius: 14px; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .install-dlg-titles { flex: 1; min-width: 0; }
    .install-dlg-name {
      font-size: 17px; font-weight: 700; color: #000; letter-spacing: -0.01em;
      display: block;
    }
    .install-dlg-sub {
      font-size: 13px; color: rgba(0,0,0,0.45); margin-top: 1px; display: block;
    }
    .install-dlg-close {
      width: 30px; height: 30px;
      background: rgba(0,0,0,0.1);
      border: none; border-radius: 50%;
      font-size: 16px; color: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-family: inherit; line-height: 1;
      position: absolute; top: 16px; right: 16px;
    }
    /* Desc */
    .install-dlg-desc {
      padding: 0 18px 16px;
      font-size: 15px; color: #000; line-height: 1.5;
    }
    /* Divider */
    .install-dlg-divider {
      height: 0.5px; background: rgba(0,0,0,0.14); margin: 0 18px;
    }
    /* Action rows — grouped iOS table-view style */
    .install-dlg-actions { padding: 0 12px 14px; }
    .install-dlg-action-group {
      background: rgba(0,0,0,0.06);
      border-radius: 14px; overflow: hidden;
    }
    .install-dlg-row {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 14px; cursor: pointer;
      border: none; border-bottom: 0.5px solid rgba(0,0,0,0.1);
      width: 100%; text-align: left; font-family: inherit;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }
    .install-dlg-row:last-child { border-bottom: none; }
    .install-dlg-row:active { background: rgba(0,0,0,0.06); }
    .install-dlg-row-icon {
      width: 34px; height: 34px;
      background: rgba(0,0,0,0.1);
      border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .install-dlg-row-label {
      font-size: 16px; font-weight: 500; color: #000; letter-spacing: -0.01em;
    }
    /* Steps screen */
    .install-dlg-steps { padding: 6px 0 4px; }
    .install-dlg-step {
      display: flex; align-items: center; gap: 14px;
      padding: 11px 18px;
    }
    .install-dlg-step-icon {
      width: 38px; height: 38px;
      background: rgba(0,0,0,0.08);
      border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .install-dlg-step-label {
      font-size: 15px; font-weight: 600; color: #000;
    }
    /* Back button */
    .install-dlg-back {
      margin: 4px 12px 14px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.08); border: none;
      border-radius: 14px; padding: 14px 20px;
      font-size: 17px; font-weight: 500; color: #000;
      cursor: pointer; font-family: inherit; width: calc(100% - 24px);
    }
    /* Screen swap animation */
    .install-screen { transition: opacity 0.18s ease; }
    .install-screen.hidden { display: none; }

    /* ─── Name prompt ─── */
    .name-prompt {
      position: fixed; inset: 0; background: #fff; z-index: 9999;
      display: flex; flex-direction: column; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    }
    .name-prompt-hero { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 48px 28px 36px; }
    .name-prompt-title {
      font-size: 48px; font-weight: 800; letter-spacing: -0.025em;
      text-transform: uppercase; line-height: 0.88; color: #000; margin-bottom: 20px;
    }
    .name-prompt-sub { font-size: 11px; letter-spacing: 0.05em; color: #999; line-height: 1.8; text-transform: uppercase; }
    .name-prompt-body { border-top: 1px solid #f0f0f0; padding: 32px 28px; display: flex; flex-direction: column; gap: 24px; }
    .name-prompt-field {}
    .name-prompt-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #bbb; margin-bottom: 12px; }
    .name-prompt-input {
      width: 100%; border: none; border-bottom: 2px solid #000;
      font-size: 18px; font-family: inherit; font-weight: 600;
      padding: 8px 0 10px; outline: none; background: none; color: #000;
      text-transform: uppercase;
    }
    .name-prompt-input::placeholder { color: #ccc; font-weight: 400; }
    .name-prompt-field.has-error .name-prompt-input { border-bottom-color: #e33; }
    .name-prompt-error {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #e33; margin-top: 8px; min-height: 11px;
    }
    .name-prompt-actions { padding: 0 28px 20px; }
    .name-prompt-cta {
      display: block; width: 100%; background: #000; color: #fff; border: none;
      font-family: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 16px; cursor: pointer;
    }

    /* ─── Empty state ─── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 28px;
    }
    .empty-hero {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 0.88;
      color: #ebebeb;
    }
    .empty-cta {
      margin-top: 32px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      border-bottom: 1px solid #000;
      padding-bottom: 3px;
      cursor: pointer;
      font-family: inherit;
      color: #000;
    }

    /* ─── Item detail — new editorial layout ─── */
    .item-detail-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; background: #fff; position: relative;
    }
    .item-detail-img-wrap {
      width: 100%; aspect-ratio: 1/1; background: #fff;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .item-detail-img-wrap img { width: 88%; height: 88%; object-fit: contain; mix-blend-mode: multiply; }
    .item-detail-img-wrap .ph-lg {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #d0d0d0; padding: 40px; text-align: center;
    }
    .item-detail-hdr {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 14px 16px 0;
      pointer-events: none;
    }
    .item-detail-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(40px) saturate(160%);
      -webkit-backdrop-filter: blur(40px) saturate(160%);
      border: none;
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.05), 0 2px 14px rgba(0,0,0,0.09), inset 0 1.5px 0 rgba(255,255,255,1), inset 0 -0.5px 0 rgba(0,0,0,0.04);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }
    .item-detail-btn:active { transform: scale(0.91); }
    .item-detail-title {
      font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
      line-height: 1.15; color: #000;
      padding: 16px 20px 4px; text-align: center;
    }
    .item-detail-status {
      font-size: 13px; letter-spacing: 0; color: #aaa;
      padding: 0 20px 14px; font-weight: 400; text-align: center;
    }
    .item-meta-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid #f2f2f2;
      min-height: 50px;
    }
    .item-meta-label {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: #aaa; width: 88px; flex-shrink: 0; line-height: 1.4;
    }
    .item-meta-value {
      flex: 1; font-size: 15px; color: #000; text-align: right;
      font-weight: 400; line-height: 1.4;
    }
    .item-meta-value a { color: #000; text-decoration: underline; text-underline-offset: 3px; }
    .item-detail-actions {
      padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 10px;
    }

    /* ─── Item bottom sheet ─── */
    @keyframes itemSheetIn {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes itemSheetOut {
      from { transform: translateY(0); }
      to   { transform: translateY(100%); }
    }
    .item-sheet-backdrop {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: fadeIn 0.22s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes itemRowIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .item-row-new { animation: itemRowIn 0.28s ease-out both; }
    @keyframes wlHeaderMetaIn {
      from { max-height: 0; opacity: 0; }
      to   { max-height: 200px; opacity: 1; }
    }
    .wl-header-meta-reveal {
      overflow: hidden;
      animation: wlHeaderMetaIn 0.38s cubic-bezier(0.22,1,0.36,1) 0.22s both;
    }
    .item-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 301;
      background: #fff;
      border-radius: 24px 24px 0 0;
      max-height: 92dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: itemSheetIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.12);
    }
    .item-sheet-handle {
      width: 36px; height: 4px;
      background: #ddd; border-radius: 2px;
      margin: 10px auto 0; flex-shrink: 0;
    }
    .item-sheet-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* keep old classes for shared item detail which hasn't been redesigned */
    .detail-image {
      width: 100%; aspect-ratio: 1/1; background: #fff; flex-shrink: 0;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .detail-image img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .detail-image .ph-lg {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #d0d0d0; padding: 40px; text-align: center;
    }
    .detail-body { padding: 18px 20px 48px; }
    .detail-days { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #bbb; margin-bottom: 5px; }
    .detail-brand { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #999; margin-bottom: 2px; }
    .detail-name { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; line-height: 1.3; }
    .detail-url {
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      color: #bbb; text-decoration: underline; cursor: pointer;
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detail-section-label {
      font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      color: #bbb; margin-top: 18px; margin-bottom: 5px;
    }
    .detail-note { font-size: 12px; letter-spacing: 0.03em; color: #444; line-height: 1.65; }
    .detail-price-val { font-size: 13px; letter-spacing: 0.06em; color: #000; }
    .detail-added { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #bbb; }
    .detail-actions { margin-top: 24px; padding-top: 20px; border-top: 1px solid #f2f2f2; display: flex; flex-direction: column; gap: 10px; }
    .detail-subnote {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #bbb;
      margin-top: 8px;
    }

    /* ─── Buttons ─── */
    .btn {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 14px 16px;
      cursor: pointer;
      border: none;
      text-align: center;
      width: 100%;
    }
    .btn:active { opacity: 0.7; }
    .btn-black { background: #000; color: #fff; }
    .btn-outline { background: none; border: 1px solid #000; color: #000; }
    .btn-ghost { background: none; border: 1px solid #e0e0e0; color: #888; }
    .btn-text { background: none; color: #bbb; text-decoration: underline; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 0; cursor: pointer; font-family: inherit; border: none; width: 100%; }
    .btn-link-cta { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }

    /* ─── Profile ─── */
    .profile-body { flex: 1; display: flex; flex-direction: column; padding: 36px 28px; }
    .profile-hero { font-size: 54px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; line-height: 0.88; color: #ebebeb; margin-bottom: 40px; }
    .profile-stat-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f4f4f4; }
    .profile-stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #bbb; }
    .profile-stat-val { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #000; font-weight: 600; }
    .profile-tagline { margin-top: 40px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #ddd; line-height: 1.7; }
    .profile-substat-row { padding-left: 14px; }
    .profile-substat-label { color: #c7c7c7; }

    /* ─── Add item — URL step ─── */
    /* ─── Add item — Form step ─── */
    .form-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .form-image-area {
      width: 100%; aspect-ratio: 1/1;
      background: #fafafa;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
      cursor: pointer;
    }
    .form-image-area img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .form-image-area .ph-lg { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #d0d0d0; padding: 40px; text-align: center; }
    .form-image-btn-row {
      position: absolute; bottom: 10px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 6px;
      pointer-events: none;
    }
    .form-image-btn-row button { pointer-events: all; }
    .form-image-change-btn {
      font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
      background: rgba(255,255,255,0.9); border: 1px solid #e0e0e0;
      padding: 5px 9px; cursor: pointer; font-family: inherit; color: #555;
    }
    /* Alternate images found while fetching — tap one to swap the main preview,
       instead of having to download/re-upload when the auto-pick is wrong. */
    .form-img-candidates {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding: 10px 20px; border-bottom: 1px solid #f0f0f0;
    }
    .form-img-candidates::-webkit-scrollbar { display: none; }
    .form-img-cand {
      flex-shrink: 0; width: 48px; height: 48px;
      background: #fafafa; border: 2px solid transparent; padding: 0;
      cursor: pointer; overflow: hidden;
    }
    .form-img-cand.active { border-color: var(--accent); }
    .form-img-cand img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .form-url-row { display: flex; gap: 8px; }
    .form-url-row .form-input { flex: 1; }
    .form-fetch-btn {
      flex-shrink: 0; font-family: inherit; font-size: 9px; letter-spacing: 0.15em;
      text-transform: uppercase; background: #000; color: #fff;
      border: none; padding: 0 16px; cursor: pointer;
    }
    .form-fetch-status { margin-top: 8px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #bbb; }
    .form-body { padding: 20px 20px 60px; }
    .form-group { margin-bottom: 24px; }
    .form-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #bbb; display: block; margin-bottom: 8px; }
    .form-input {
      width: 100%; border: none; border-bottom: 1px solid #d8d8d8;
      padding: 7px 0; font-size: 13px; font-family: inherit;
      letter-spacing: 0.03em; outline: none; color: #000; background: transparent;
    }
    .form-input:focus { border-bottom-color: #000; }
    .form-input::placeholder { color: #ccc; }
    textarea.form-input { resize: none; min-height: 56px; line-height: 1.6; }
    .form-input-sm { width: 44%; }
    .form-select {
      width: 100%; border: none; border-bottom: 1px solid #d8d8d8;
      padding: 7px 0; font-size: 13px; font-family: inherit;
      letter-spacing: 0.03em; outline: none; color: #000; background: transparent;
      appearance: none; cursor: pointer;
    }

    .intent-pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .intent-pill {
      border: 1px solid #d8d8d8;
      background: #fff;
      color: #777;
      border-radius: 999px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .intent-pill.active { border-color: var(--accent); background: var(--accent); color: #000; }

    /* ─── Wishlist detail — editorial header ─── */
    .wl-editorial-header { padding: 20px 24px 12px; text-align: center; }
    .wl-editorial-title {
      font-size: 32px; font-weight: 700; letter-spacing: -0.02em;
      text-transform: none; line-height: 1.1; color: #000;
      border: none; outline: none; background: none;
      font-family: inherit; width: 100%; text-align: center;
      padding: 0; display: block;
    }
    .wl-editorial-desc {
      font-size: 14px; letter-spacing: 0; color: #999;
      line-height: 1.65; margin-top: 10px; border: none;
      outline: none; background: none; font-family: inherit;
      width: 100%; text-align: center; resize: none;
      min-height: 20px; display: block; padding: 0;
      font-weight: 400; text-transform: none;

      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #ccc; text-align: center; padding: 6px 24px 18px; margin: 0;
    }

    /* ─── Wishlist detail card (cleaner, no day prefix) ─── */
    .wl-card-brand-price {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #bbb; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .wl-card-name {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #000; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ─── Currency field ─── */
    .currency-field {
      display: inline-flex; align-items: baseline;

    /* ─── Wishlist picker (form) ─── */
    .wl-picker { display: flex; flex-wrap: wrap; gap: 6px; }

    .wl-new-wl-input {

    /* ─── Tags ─── */
    .tag-pill-wrap { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .tag-pill {

    .tag-add-trigger {
      display: inline-flex; align-items: center; border: 1px solid #d0d0d0;

    .tag-filter-bar {

      padding: 5px 12px; font-size: 9px; letter-spacing: 0.14em;

    .overlay-body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 32px 28px 48px; }
    .overlay-title-sm { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #bbb; margin-bottom: 12px; }
    .overlay-headline { font-size: 32px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.9; margin-bottom: 32px; }
    .overlay-btns { display: flex; flex-direction: column; gap: 10px; }

    /* ─── Toast ─── */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 8px) + 72px);
      left: 20px; right: 20px;
      background: #000; color: #fff;
      padding: 11px 16px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 999; opacity: 0; transition: opacity 0.22s ease; pointer-events: none;
    }
    #toast.show { opacity: 1; pointer-events: auto; }

    /* ─── Boards gallery ─── */
    .boards-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; padding: 14px;
    }
    .board-card {
      background: #fff; cursor: pointer;

    }
    .board-card:active { opacity: 0.8; }
    .board-card img { width: 100%; height: auto; display: block; }
    .board-card-empty { aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; }
    .board-card-share-btn {
      position: absolute; top: 8px; right: 8px;

      background: rgba(0,0,0,0.38); border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;

    }
    .board-card-del-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px;
      background: none; border: none; cursor: pointer;

    }
    .board-card-meta {

      background: linear-gradient(transparent, rgba(0,0,0,0.32));
    }
    .board-card-name {
      font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase;
      color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ─── Board detail (preview) ─── */
    .board-detail-screen { display: flex; flex-direction: column; flex: 1; min-height: 0; background: #fff; }
    .board-detail-preview { width: 100%; aspect-ratio: 3/4; background: #fff; flex-shrink: 0; margin-top: 4px; }
    .board-detail-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .board-detail-items-label { padding: 4px 24px 8px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #ccc; }

    /* ─── Board editor ─── */
    .board-editor-layout { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .be-canvas-wrap { width: 100%; aspect-ratio: 3/4; flex-shrink: 0; max-height: 58vh; position: relative; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    .be-canvas { position: absolute; inset: 0; background: #fff; }
    .be-sticker { position: absolute; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .be-sticker img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
    .be-sticker.be-selected { outline: 1.5px solid #0264FD; outline-offset: 3px; }
    .be-sticker-resize { position: absolute; bottom: -10px; right: -10px; width: 22px; height: 22px; background: #0264FD; border-radius: 50%; cursor: se-resize; touch-action: none; display: none; }
    .be-sticker.be-selected .be-sticker-resize { display: block; }
    .be-panel { position: absolute; bottom: 0; left: 0; right: 0; background: #f5f5f5; border-radius: 16px 16px 0 0; overflow: hidden; display: flex; flex-direction: column; transition: height 0.38s cubic-bezier(0.32,0.72,0,1); }
    .be-panel.no-transition { transition: none !important; }
    .be-panel-handle-wrap { flex-shrink: 0; display: flex; justify-content: center; padding: 10px 0 6px; cursor: grab; touch-action: none; }
    .be-panel-handle { width: 36px; height: 4px; background: #d0d0d0; border-radius: 2px; }
    .be-action-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 32px max(env(safe-area-inset-bottom),20px); display: flex; gap: 12px; justify-content: center; align-items: center; pointer-events: none; opacity: 0; transition: opacity 0.25s ease; z-index: 20; background: linear-gradient(transparent, rgba(255,255,255,0.97) 35%); }
    .be-action-bar.visible { opacity: 1; pointer-events: auto; }
    .be-action-del { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.06); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; flex-shrink: 0; transition: background 0.15s, transform 0.15s; }
    .be-action-del.drag-target { background: #c0392b; color: #fff; transform: scale(1.2); }
    .be-action-confirm { height: 50px; padding: 0 36px; border-radius: 25px; background: #000; color: #fff; border: none; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; touch-action: manipulation; }
    .be-panel-grid { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(3,1fr); grid-auto-rows: calc((100vw - 52px) / 3); gap: 10px; padding: 8px 16px 24px; scrollbar-width: none; align-content: start; }
    .be-panel-grid::-webkit-scrollbar { display: none; }
    .be-panel-empty { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #ccc; grid-column: 1/-1; padding: 20px 0; }
    .be-item-thumb { cursor: pointer; background: #e8e8e8; overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 6px; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
    .be-item-thumb:active { opacity: 0.65; }
    .be-item-thumb img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .be-item-thumb-name { font-size: 7px; letter-spacing: 0.06em; text-transform: uppercase; color: #bbb; text-align: center; padding: 4px; line-height: 1.3; }
    .wl-moodboard-preview { position: relative; cursor: pointer; margin: 4px 0 16px; }
    .wl-moodboard-preview img { width: 100%; display: block; }
    .wl-moodboard-edit-pill { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; padding: 5px 10px; }
  </style>

<body>
  <div id="app"></div>
  <div id="toast"></div>

  <script>
  // ═══════════════════════════════════════════
  // DATA — persisted in localStorage
  // ═══════════════════════════════════════════

  const DAY = 86400000;
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let wishlists = [];
  let items = [];
  let boards = [];
  let availableTags = [];
  let shareData = null; // set when viewing a shared wishlist URL

  // A save that silently fails (most commonly: localStorage quota exceeded,
  // since images are stored as data URLs) looks fine in the current session
  // but reverts on next load — items/images appear to "disappear". Surface it
  // instead of swallowing it. Debounced so a persistent quota failure doesn't
  // spam a toast on every subsequent save attempt.
  let _lastStorageWarnAt = 0;
  function warnStorageFailure() {
    const now = Date.now();
    if (now - _lastStorageWarnAt < 15000) return;
    _lastStorageWarnAt = now;
    showActionToast("Couldn't save — storage is full.", 'Fix It', shrinkAllImages);
  }

  function saveData() {
    try {
      localStorage.setItem('vitrine_wishlists', JSON.stringify(wishlists));
      localStorage.setItem('vitrine_items', JSON.stringify(items));
      return true;
    } catch(e) { warnStorageFailure(); return false; }
  }

  function loadData() {
    try {
      const wl = localStorage.getItem('vitrine_wishlists');
      const it = localStorage.getItem('vitrine_items');
      const bd = localStorage.getItem('vitrine_boards');
      if (wl) wishlists = JSON.parse(wl);
      if (it) items = JSON.parse(it);
      if (bd) boards = JSON.parse(bd);
    } catch(e) {
      wishlists = [];
      items = [];
      boards = [];
    }
  }

  function saveBoardData() {
    try { localStorage.setItem('vitrine_boards', JSON.stringify(boards)); return true; }
    catch(e) { warnStorageFailure(); return false; }
  }

  // Retroactively shrinks any already-stored item image that predates the
  // 1000px cap added to the background-removal pipeline. Existing users could
  // have images saved at full source resolution eating most of the quota —
  // this re-saves them smaller in place so future saves have room again.
  function shrinkDataUrl(dataUrl, maxDim) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        if (scale >= 1) { resolve(null); return; } // already small enough
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/webp', 0.9)); } catch { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
  }

  async function shrinkAllImages() {
    if (s.shrinkingImages) return;
    s.shrinkingImages = true;
    render();
    await new Promise(r => setTimeout(r, 0)); // yield so the "Optimizing…" state paints

    const MAX_DIM = 1000;
    const isOversizable = img => img && (img.startsWith('data:image/png') || img.startsWith('data:image/jpeg') || img.startsWith('data:image/webp'));
    let changed = 0;
    for (let i = 0; i < items.length; i++) {
      const img = items[i].img;
      if (!isOversizable(img)) continue;
      const shrunk = await shrinkDataUrl(img, MAX_DIM);
      if (shrunk && shrunk.length < img.length) {
        items[i] = { ...items[i], img: shrunk };
        changed++;
      }
    }
    for (let i = 0; i < wishlists.length; i++) {
      const img = wishlists[i].coverImg;
      if (!isOversizable(img)) continue;
      const shrunk = await shrinkDataUrl(img, MAX_DIM);
      if (shrunk && shrunk.length < img.length) {
        wishlists[i] = { ...wishlists[i], coverImg: shrunk };
        changed++;
      }
    }

    const ok = saveData();
    s.shrinkingImages = false;
    render();
    if (!ok) {
      showToast('Still full — try deleting a few items or images.');
    } else if (changed > 0) {
      showToast(`Shrunk ${changed} image${changed===1?'':'s'} — saving normally again.`);
    } else {
      showToast('Nothing to shrink — try deleting a few items instead.');
    }
  }

  // ═══════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════

  const s = {
    screen: 'items',
    wlSubTab: 'items',  // 'items' | 'wishlists' — sub-tab within the home main tab (Items is the default landing view)
    overlay: null,
    currentWid: null,
    currentIid: null,
    fromScreen: null,
    fromWid: null,
    addWid: null,
    addStep: 'form',
    addIsEdit: false,
    addFetching: false,
    wlEditMode: false,
    wlItemEditMode: false,
    wlDetailFilterTags: [], // active tag filters inside a wishlist detail
    wlPickerFilterTags: [], // active tag filters inside the "add saved items to this list" picker
    itemsFilterTags: [],
    categoryFilters: [],    // active category filter pills on Items; empty = All
    categorySubFilters: [], // active fashion subcategory keys; empty = All (only shown when 'fashion' is selected)
    addForm: { url:'', name:'', brand:'', tags:[], img:'', imgCandidates: [], price:'', saved:'', note:'', wid:'', showTagInput: false, tagQuery: '', showNewWl: false },
    removingBg: false,
    shrinkingImages: false,
    sharedItemIdx: 0,
    wlSlideDir: null,   // 'right' | 'left' | null — direction for sub-tab slide animation
    currentBoardId: null, // board shown on the board-detail (preview) screen
    boardSlideIn: false,  // true for one render when pushing into board-detail, to trigger the slide-in animation
  };

  let longPressTimer = null;
  let dragSrcIdx = null;
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; });

  // ═══════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════

  const pad = n => String(Math.min(Math.max(n,0),999)).padStart(3,'0');
  const days = ts => Math.max(0, Math.floor((Date.now() - ts) / DAY));
  const fmt = n => n.toLocaleString('en-US');
  const money = n => `$${fmt(Math.round((Number(n) || 0) * 100) / 100)}`;
  const fmtDate = ts => new Date(ts).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const sumPrice = arr => arr.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
  const totalWatchingValue = (wid=null) => sumPrice(watchingItems(wid));

  const watchingItems = (wid=null) => items
    .filter(i => i.status === 'watching' && (wid ? i.wid === wid : true))
    .sort((a,b) => b.addedAt - a.addedAt);
  // Everything you've saved, watching or owned — used by the browsing grids
  // (Items/Category/Lists) so items you already own don't just vanish from
  // view once marked owned.
  const savedItems = (wid=null) => items
    .filter(i => (i.status === 'watching' || i.status === 'purchased') && (wid ? i.wid === wid : true))
    .sort((a,b) => b.addedAt - a.addedAt);
  const wishlistItems = (wid) => items
    .filter(i => (i.status === 'watching' || i.status === 'purchased') && i.wid === wid)
    .sort((a,b) => {
      if (a.status === 'purchased' && b.status !== 'purchased') return 1;
      if (b.status === 'purchased' && a.status !== 'purchased') return -1;
      const ao = a.order ?? a.addedAt;
      const bo = b.order ?? b.addedAt;
      return bo - ao;
    });
  const getItem = id => items.find(i => i.id === id);
  const getWl = id => wishlists.find(w => w.id === id);
  const wlCover = wid => {
    const it = watchingItems(wid)[0];
    return it?.img || null;
  };

  // ═══════════════════════════════════════════
  // RENDER ENGINE
  // ═══════════════════════════════════════════

  let toastTimer;

  function render() {
    document.getElementById('app').innerHTML = buildScreen();
    if (s.overlay && s.overlay !== 'change-cover') {
      document.getElementById('app').insertAdjacentHTML('beforeend', buildOverlay());
    }
    // Apply smart crop to list-thumb images (cache hit = no onload fires)
    setTimeout(() => {
      document.querySelectorAll('.list-thumb img').forEach(img => {
        if (img.complete && img.naturalWidth && !img.style.objectViewBox) {
          smartCropThumb(img);
        }
      });
      if (s.screen === 'add-wishlist') {
        document.getElementById('wl-name-input')?.focus();
      }
    }, 60);
  }

  let _undoFn = null;

  function showToast(msg) {
    _undoFn = null;
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${msg}</span>`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function showUndoToast(msg, undoFn) {
    _undoFn = undoFn;
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${msg}</span><button onclick="doUndo()" style="background:none;border:none;color:var(--accent);font-family:inherit;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;padding:0;flex-shrink:0">Undo</button>`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); _undoFn = null; }, 4000);
  }

  function doUndo() {
    if (!_undoFn) return;
    _undoFn();
    _undoFn = null;
    clearTimeout(toastTimer);
    document.getElementById('toast').classList.remove('show');
  }

  // Same shape as showUndoToast but with a configurable label — used for
  // toasts that offer to fix something rather than undo the last action.
  function showActionToast(msg, label, fn) {
    _undoFn = fn;
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${msg}</span><button onclick="doUndo()" style="background:none;border:none;color:var(--accent);font-family:inherit;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;padding:0;flex-shrink:0">${esc(label)}</button>`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); _undoFn = null; }, 6000);
  }

  // ═══════════════════════════════════════════
  // COMPONENTS
  // ═══════════════════════════════════════════

  function nav(active) {
    // active = 'wishlists' | 'boards' | 'stats' | 'profile'
    const tabs = ['wishlists','boards','stats','profile'];
    const labels = { wishlists:'Wishlists', boards:'Boards', stats:'Stats', profile:'Profile' };

  function wishlistCollage(wid) {
    if (getWl(wid)?.coverImg) {
      return `<img src="${getWl(wid).coverImg}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" />`;
    }
    const imgs = watchingItems(wid).filter(i => i.img).slice(0, 4);
    if (imgs.length === 0) {
      const wl = getWl(wid);
      return `<div class="folder-initial">${wl?.name[0]?.toUpperCase() || '?'}</div>`;

    return `<div class="wl-collage wl-collage-${n}">

  function installShowMain() {
    const s1 = document.getElementById('install-screen-1');
    const s2 = document.getElementById('install-screen-2');

  async function triggerInstall() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (result.outcome === 'accepted') dismissOnboarding();
  }

  function getUserName() {
    try { return localStorage.getItem('vtr_user_name') || ''; } catch(e) { return ''; }
  }

  function saveUserName(name) {
    try { localStorage.setItem('vtr_user_name', name.trim()); } catch(e) {}
  }

  function getUserEmail() {
    try { return localStorage.getItem('vtr_user_email') || ''; } catch(e) { return ''; }
  }

  function saveUserEmail(email) {
    try { localStorage.setItem('vtr_user_email', email.trim()); } catch(e) {}
  }

  // A "signed in" user, on this no-backend/offline-first app, is simply someone
  // who has completed the local sign-up gate — there's no server-side account.
  function isSignedIn() {
    return !!getUserName();
  }

  const SIGNUP_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzw0GAxLcssdIfux9t0J6XPZ2k3bC8TQhbDAQvWtDhBTASkbDhYyBsajG77VpYOQQyx/exec';

  function showNamePrompt() {
    document.getElementById('app').innerHTML = `
      <div class="name-prompt" id="name-prompt">
        <div class="name-prompt-hero">
          <p class="ob-eyebrow">Alpha Version</p>
          <h1 class="name-prompt-title">Curate</h1>

        </div>
        <div class="name-prompt-body">
          <div class="name-prompt-field" id="name-prompt-name-field">
            <p class="name-prompt-label">Your name</p>
            <input class="name-prompt-input" id="name-prompt-input" type="text"
              placeholder="First name" autocomplete="given-name" autocorrect="off"
              oninput="clearNamePromptError('name')"
              onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('email-prompt-input').focus();}" />
            <p class="name-prompt-error" id="name-prompt-name-error"></p>
          </div>
          <div class="name-prompt-field" id="name-prompt-email-field">
            <p class="name-prompt-label">Email</p>
            <input class="name-prompt-input" id="email-prompt-input" type="email"
              placeholder="your@email.com" autocomplete="email" autocorrect="off" autocapitalize="off"
              oninput="clearNamePromptError('email')"
              onkeydown="if(event.key==='Enter'){event.preventDefault();confirmName();}" />
            <p class="name-prompt-error" id="email-prompt-error"></p>
          </div>
        </div>
        <div class="name-prompt-actions">
          <button class="name-prompt-cta" onclick="confirmName()">Sign Up</button>
        </div>
      </div>`;
    setTimeout(() => {
      const el = document.getElementById('name-prompt-input');
      if (el) el.focus();
    }, 100);
  }

  function clearNamePromptError(field) {
    const fieldEl = document.getElementById(`name-prompt-${field}-field`);
    const errEl = document.getElementById(field === 'name' ? 'name-prompt-name-error' : 'email-prompt-error');
    fieldEl?.classList.remove('has-error');
    if (errEl) errEl.textContent = '';
  }

  function confirmName() {
    const nameEl = document.getElementById('name-prompt-input');
    const emailEl = document.getElementById('email-prompt-input');
    const name = nameEl ? nameEl.value.trim() : '';
    const email = emailEl ? emailEl.value.trim() : '';
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    const nameField = document.getElementById('name-prompt-name-field');
    const emailField = document.getElementById('name-prompt-email-field');
    const nameErr = document.getElementById('name-prompt-name-error');
    const emailErr = document.getElementById('email-prompt-error');

    let valid = true;
    if (!name) {
      nameField?.classList.add('has-error');
      if (nameErr) nameErr.textContent = 'Please enter your name.';
      valid = false;
    }
    if (!emailOk) {
      emailField?.classList.add('has-error');
      if (emailErr) emailErr.textContent = 'Please enter a valid email.';
      valid = false;
    }
    if (!valid) return;

    saveUserName(name);
    saveUserEmail(email);
    if (!localStorage.getItem('vtr_signed_up')) {
      localStorage.setItem('vtr_signed_up', '1');
      fetch(SIGNUP_SHEET_URL, {
        method: 'POST',
        body: JSON.stringify({ name, email }),
      }).catch(() => {});
    }
    render();
    maybeShowInstallPrompt();
  }

  function dismissOnboarding() {
    try { localStorage.setItem('vtr_ob_dismissed', '1'); } catch(e) {}
    const overlay = document.getElementById('install-overlay-el');
    if (overlay) {
      overlay.classList.remove('is-open');
      setTimeout(() => overlay.remove(), 240);
    }
    if (!getUserName()) {
      setTimeout(() => showNamePrompt(), 260);
    }
  }

  // Nudge to install as a PWA — shown after sign-up, only in Safari/browser
  // (not yet installed) and only if the user hasn't dismissed it before.
  function maybeShowInstallPrompt() {
    const isInstalled = window.navigator.standalone === true
      || window.matchMedia('(display-mode: standalone)').matches;
    const obDismissed = (() => { try { return !!localStorage.getItem('vtr_ob_dismissed'); } catch(e) { return false; } })();
    if (!isInstalled && !obDismissed) {
      setTimeout(showOnboarding, 800);
    }
  }

  function buildScreen() {
    switch(s.screen) {
      case 'wishlists':       return screenWlTab();
      case 'wishlist-detail': return screenWlDetail();
      case 'items':           return screenWlTab();
      case 'boards':          return screenBoards();
      case 'board-detail':    return screenBoardDetail();
      case 'board-editor':    return screenBoardEditor();
      case 'stats':           return screenStats();
      case 'profile':         return screenProfile();
      case 'item-detail':     return screenItemDetail();
      case 'add-wishlist':    return screenAddWishlist();
      case 'add-item':        return screenAddItem();
      case 'shared-wl':       return screenSharedWl();
      case 'shared-item':     return screenSharedItemDetail();
      default: return screenWlTab();
    }
  }

  // Wraps items/wishlists into a single tabbed view (the home tab)
  // Uses s.screen as source of truth so direct screen assignments work correctly
  function screenWlTab() {
    s.wlSubTab = s.screen; // keep in sync
    switch(s.screen) {
      case 'wishlists': return screenWishlists();
      default:          return screenItems();
    }
  }

  function screenSharedWl() {
    if (!shareData) { s.screen = 'wishlists'; return screenWishlists(); }

  // ── Share encoding: compact keys + deflate compression ──────────
  // New format: 'z' + URL-safe base64 of deflate-compressed compact JSON
  // Legacy format: plain base64 JSON (still decoded for backward compat)
  async function encodeShare(payload) {
    const compact = {
      v: 2,
      w: { n: payload.wl.name, c: payload.wl.coverImg || '' },
      ...(payload.senderName ? { s: payload.senderName } : {}),
      ...(payload.perm && payload.perm !== 'view' ? { p: payload.perm } : {}),
      i: payload.items.map(i => ({
        n: i.name, b: i.brand || '', m: i.img || '',
        p: i.price || '', u: i.url || '',
        ...(i.tags?.length ? { t: i.tags } : {}),
        ...(i.note       ? { o: i.note  } : {}),
        a: i.addedAt,
      }))
    };
    const json = JSON.stringify(compact);
    if (typeof CompressionStream !== 'undefined') {
      try {
        const cs = new CompressionStream('deflate-raw');
        const w = cs.writable.getWriter();
        w.write(new TextEncoder().encode(json));
        w.close();
        const r = cs.readable.getReader();
        const chunks = [];
        while (true) { const { done, value } = await r.read(); if (done) break; chunks.push(value); }
        const buf = new Uint8Array(chunks.reduce((s, c) => s + c.length, 0));
        let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
        return 'z' + btoa(String.fromCharCode(...buf)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
      } catch {}
    }
    return btoa(unescape(encodeURIComponent(json)));
  }

  function expandShare(obj) {
    if (!obj) return null;
    if (obj.w) return {  // v2 compact format
      wl: { name: obj.w.n || '', coverImg: obj.w.c || '' },
      senderName: obj.s || '',
      perm: obj.p || 'view',
      items: (obj.i || []).map(i => ({
        name: i.n || '', brand: i.b || '', img: i.m || '',
        price: i.p || '', url: i.u || '',
        tags: i.t || [], note: i.o || '', addedAt: i.a
      }))
    };
    return obj; // legacy full-key format
  }

  async function decodeShare(str) {
    try {
      if (str.startsWith('z') && typeof DecompressionStream !== 'undefined') {
        const b64 = str.slice(1).replace(/-/g,'+').replace(/_/g,'/');
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const ds = new DecompressionStream('deflate-raw');
        const w = ds.writable.getWriter(); w.write(bytes); w.close();
        const r = ds.readable.getReader(); const chunks = [];
        while (true) { const { done, value } = await r.read(); if (done) break; chunks.push(value); }
        const buf = new Uint8Array(chunks.reduce((s, c) => s + c.length, 0));
        let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
        return expandShare(JSON.parse(new TextDecoder().decode(buf)));
      }
      return expandShare(JSON.parse(decodeURIComponent(escape(atob(str)))));
    } catch(e) { return null; }
  }

  function screenStats() {
    const watching = watchingItems();
    const purchased = items.filter(i => i.status === 'purchased');
    const purchasedValue = sumPrice(purchased);
    const watchingValue = totalWatchingValue();

    // Top brand across all items ever
    const brandCounts = {};
    items.forEach(i => { if (i.brand?.trim()) brandCounts[i.brand.trim()] = (brandCounts[i.brand.trim()] || 0) + 1; });
    const topBrand = Object.entries(brandCounts).sort((a,b) => b[1]-a[1])[0] || null;

    // Top tag across all items ever
    const tagCounts = {};
    items.forEach(i => (i.tags||[]).forEach(t => { if (t) tagCounts[t] = (tagCounts[t] || 0) + 1; }));
    const topTag = Object.entries(tagCounts).sort((a,b) => b[1]-a[1])[0] || null;

    // Top category (Fashion/Beauty/Home) across all items ever, auto-detected
    // for anything that was never explicitly categorized
    const categoryCounts = {};
    items.forEach(i => {
      const cat = i.category || classifyItem(i).category;
      if (cat) categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
    });
    const topCategoryEntry = Object.entries(categoryCounts).sort((a,b) => b[1]-a[1])[0] || null;
    const topCategory = topCategoryEntry
      ? { label: CATEGORY_TAXONOMY[topCategoryEntry[0]]?.label || topCategoryEntry[0], count: topCategoryEntry[1] }
      : null;

    // Item that shows up in the most boards — only worth calling out once it repeats
    const boardFeatureCounts = {};
    boards.forEach(b => {
      const seen = new Set((b.stickers || []).map(st => st.itemId).filter(Boolean));
      seen.forEach(id => { boardFeatureCounts[id] = (boardFeatureCounts[id] || 0) + 1; });
    });
    const topFeaturedEntry = Object.entries(boardFeatureCounts).sort((a,b) => b[1]-a[1])[0] || null;
    const mostFeatured = topFeaturedEntry && topFeaturedEntry[1] >= 2 ? getItem(topFeaturedEntry[0]) : null;
    const mostFeaturedCount = topFeaturedEntry ? topFeaturedEntry[1] : 0;

    // Longest currently-watching item
    const oldest = watching.length > 0
      ? watching.reduce((a, b) => a.addedAt < b.addedAt ? a : b)
      : null;
    const oldestDays = oldest ? days(oldest.addedAt) : 0;

    const statRow = (label, value, sub='') => `
      <div class="profile-stat-row">
        <span class="profile-stat-label">${label}</span>
        <div style="text-align:right">
          <span class="profile-stat-val">${value}</span>
          ${sub ? `<p style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#ccc;margin-top:2px">${sub}</p>` : ''}
        </div>
      </div>`;

    const sectionLabel = label => `
      <p style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#bbb;margin-top:36px;padding-bottom:10px;border-bottom:1px solid #f4f4f4">${label}</p>`;

    if (items.length === 0) {
      return `
        ${minimalHeader()}
        <div class="scroll-area scroll-area-empty">
          <div class="empty-state">
            <p class="empty-hero">no<br/>data<br/>yet</p>
            <p style="margin-top:20px;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#ccc;text-align:left">Start curating to see your patterns</p>
          </div>
        </div>
        ${homeNav('stats')}`;
    }

    const featureCard = (item, metaLine) => `
      <div onclick="openItem('${item.id}')" style="display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #f4f4f4;cursor:pointer">
        <div style="width:56px;height:56px;background:#f9f9f9;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center">
          ${item.img
            ? `<img src="${esc(item.img)}" style="width:100%;height:100%;object-fit:contain" />`
            : `<span style="font-size:8px;letter-spacing:0.06em;text-transform:uppercase;color:#ccc;text-align:center;padding:4px;line-height:1.4">${esc(item.name)}</span>`}
        </div>
        <div style="flex:1;min-width:0">
          <p style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#bbb;margin-bottom:4px">${metaLine}</p>
          <p style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(item.name)}</p>
          ${item.price ? `<p style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#bbb;margin-top:3px">${money(item.price)}</p>` : ''}
        </div>
        <span style="font-size:18px;color:#ddd;flex-shrink:0">›</span>
      </div>`;

    return `
      ${minimalHeader()}
      <div class="scroll-area">
        <div style="padding:8px 28px 80px">

          ${(topBrand || topTag || topCategory) ? sectionLabel('Your Pattern') : ''}
          ${topBrand ? statRow('Most Saved Brand', esc(topBrand[0]), topBrand[1] + ' ' + (topBrand[1] === 1 ? 'item' : 'items')) : ''}
          ${topCategory ? statRow('Top Category', esc(topCategory.label), topCategory.count + ' ' + (topCategory.count === 1 ? 'item' : 'items')) : ''}
          ${topTag ? statRow('Top Tag', esc(topTag[0]), topTag[1] + ' ' + (topTag[1] === 1 ? 'item' : 'items')) : ''}

          ${sectionLabel('Right Now')}
          ${statRow('Watching', watching.length + ' ' + (watching.length === 1 ? 'Item' : 'Items'))}
          ${purchased.length > 0 ? statRow('Owned', purchased.length + ' ' + (purchased.length === 1 ? 'Item' : 'Items')) : ''}
          ${watchingValue > 0 ? statRow('Value Watching', money(watchingValue)) : ''}
          ${purchasedValue > 0 ? statRow('Value Owned', money(purchasedValue)) : ''}

          ${sectionLabel('Your Collection')}
          ${statRow('Lists', wishlists.length)}
          ${statRow('Boards', boards.length)}
          ${statRow('Items Saved', items.length)}

          ${mostFeatured ? `
          ${sectionLabel('Most Featured')}
          ${featureCard(mostFeatured, `In ${mostFeaturedCount} Boards`)}` : ''}

          ${oldest ? `
          ${sectionLabel('Longest Watch')}
          ${featureCard(oldest, `${pad(oldestDays)} Days`)}` : ''}

        </div>
      </div>
      ${homeNav('stats')}`;
  }

  function addItemForm() {
    const f = s.addForm;
    const imgH = f.img
      ? `<img src="${f.img}" alt="" id="form-img-preview" />`
      : `<div class="ph-lg" id="form-img-preview">No image found</div>`;
    const selectedWid = f.wid || s.addWid || '';
    // Always rendered so liveUpdateImg() can toggle it as the image changes
    // via background fetch, without needing a full re-render.
    const imgBtns = `
      <div class="form-image-btn-row" id="form-image-btn-row" style="${f.img ? '' : 'display:none'}">
        <button class="form-image-change-btn" onclick="event.stopPropagation();document.getElementById('item-file-input').click()">Change Image</button>
      </div>`;
    // Always rendered (even empty) so later candidates can be appended via
    // direct DOM updates as fetch sources resolve, without a full re-render
    // that would blow away whatever the user is mid-typing elsewhere in the form.
    const candidates = f.imgCandidates || [];
    const candStrip = `
      <div class="form-img-candidates" id="form-img-candidates" onclick="event.stopPropagation()" style="${candidates.length > 1 ? '' : 'display:none'}">
        ${candidates.map(url => `
          <button type="button" class="form-img-cand ${url===f.img?'active':''}" data-src="${esc(url)}" onclick="selectImgCandidate(this)">

          </button>`).join('')}

        <label class="form-label">Product Link</label>
        <div class="form-url-row">

          </div>
          ${(() => {
            const guess = classifyItem({ name: f.name, brand: f.brand, tags: f.tags });
            const activeCategory = f.category || guess.category || 'none';
            const activeSubcategory = f.subcategory || guess.subcategory || 'none';
            const categoryPills = `
              <div class="form-group">
                <label class="form-label">Category</label>
                <div class="wl-picker">
                  <button type="button" class="wl-picker-pill ${activeCategory==='none'?'active':''}" onclick="setFormCategory('none')">None</button>
                  ${Object.entries(CATEGORY_TAXONOMY).map(([key, def]) => `
                    <button type="button" class="wl-picker-pill ${activeCategory===key?'active':''}" onclick="setFormCategory('${key}')">${esc(def.label)}</button>

            const subcategoryPills = activeCategory === 'fashion' ? `

  function navTo(screen) {
    s.screen = screen;
    s.overlay = null;
    s.wlItemEditMode = false;
    s.wlEditMode = false;
    // Keep wlSubTab in sync so the sub-tab indicator stays correct
    if (screen === 'items' || screen === 'wishlists') {

      s.wlDetailFilterTags = [];

    render();
  }

  // Bottom nav tab handler — maps the 3 main tabs to screens
  function navTab(tab) {
    s.overlay = null;
    s.wlItemEditMode = false;
    s.wlEditMode = false;
    if (tab === 'wishlists') {
      const SUB_TABS = ['items', 'wishlists'];
      const fromIdx = SUB_TABS.indexOf(s.screen);
      // If already on a sub-tab that isn't the default (Items), slide back to it
      if (fromIdx > 0) {
        s.wlSlideDir = 'left';
      } else if (fromIdx === -1) {
        // Coming from a non-sub-tab screen (detail, stats, etc.) — no slide
        s.wlSlideDir = null;
      }
      s.screen = 'items';
      s.wlSubTab = 'items';
      s.currentWid = null;
      render();
      s.wlSlideDir = null;
    } else if (tab === 'boards') {
      s.screen = 'boards';
      render();
    } else if (tab === 'stats') {
      s.screen = 'stats';
      render();
    } else if (tab === 'profile') {
      s.screen = 'profile';
      render();
    }
  }

  // Switch between sub-tabs (Items / Category / Lists) within the home main tab
  function setWlSubTab(tab) {
    const SUB_TABS = ['items', 'wishlists'];
    const fromIdx = SUB_TABS.indexOf(s.screen);
    const toIdx   = SUB_TABS.indexOf(tab);
    if (toIdx !== fromIdx) s.wlSlideDir = toIdx > fromIdx ? 'right' : 'left';
    s.wlSubTab = tab;
    s.screen = tab;
    s.overlay = null;
    s.wlEditMode = false;
    render();
    s.wlSlideDir = null;
  }
