  // ── Panel state ───────────────────────────────────────────────────
  function beCollapsedH() { return Math.round(window.innerHeight * 0.42); }
  function beExpandedH()  { return Math.round(window.innerHeight * 0.72); }

  function setBoardPanel(state) {
    const panel = document.getElementById('be-panel');
    if (!panel) return;
    const h = state === 'hidden' ? 0 : state === 'expanded' ? beExpandedH() : beCollapsedH();
    _bePanelH = h;
    panel.classList.remove('no-transition');
    panel.style.height = h + 'px';
  }

  function bePanelDragStart(e) {
    e.preventDefault();
    const panel = document.getElementById('be-panel');
    if (!panel) return;
    panel.classList.add('no-transition');
    _bePanelDrag = { startY: e.clientY, startH: panel.offsetHeight };
    document.addEventListener('pointermove', _onPanelMove, { passive: false });
    document.addEventListener('pointerup', _onPanelUp);
    document.addEventListener('pointercancel', _onPanelUp);
  }

  function _onPanelMove(e) {
    if (!_bePanelDrag) return;
    e.preventDefault();
    const dy = _bePanelDrag.startY - e.clientY;
    const newH = Math.max(0, Math.min(beExpandedH() + 60, _bePanelDrag.startH + dy));
    const panel = document.getElementById('be-panel');
    if (panel) { _bePanelH = newH; panel.style.height = newH + 'px'; }
  }

  function _onPanelUp() {
    if (!_bePanelDrag) return;
    document.removeEventListener('pointermove', _onPanelMove);
    document.removeEventListener('pointerup', _onPanelUp);
    document.removeEventListener('pointercancel', _onPanelUp);
    const panel = document.getElementById('be-panel');
    if (panel) panel.classList.remove('no-transition');
    const snap = _bePanelH < beCollapsedH() * 0.35 ? 'hidden'
               : _bePanelH < (beCollapsedH() + beExpandedH()) / 2 ? 'collapsed'
               : 'expanded';
    setBoardPanel(snap);
    _bePanelDrag = null;
  }

  // ── Sticker selection ─────────────────────────────────────────────
  function selectBoardSticker(idx) {
    _boardActiveIdx = idx;
    const canvas = document.getElementById('be-canvas');
    if (canvas) canvas.querySelectorAll('.be-sticker').forEach((el, i) => el.classList.toggle('be-selected', i === idx));
    setBoardPanel('hidden');
    const bar = document.getElementById('be-action-bar');
    if (bar) bar.classList.add('visible');
  }

  function deselectBoardSticker() {
    _boardActiveIdx = -1;
    const canvas = document.getElementById('be-canvas');
    if (canvas) canvas.querySelectorAll('.be-sticker').forEach(el => el.classList.remove('be-selected'));
    setBoardPanel('collapsed');
    const bar = document.getElementById('be-action-bar');
    if (bar) bar.classList.remove('visible');
  }

  function beConfirmSelected() { deselectBoardSticker(); }

  function beDeleteSelected() {
    if (_boardActiveIdx < 0) return;
    const idx = _boardActiveIdx;
    _boardActiveIdx = -1;
    removeBoardSticker(idx);
    setBoardPanel('collapsed');
    const bar = document.getElementById('be-action-bar');
    if (bar) bar.classList.remove('visible');
  }

  function beTapCanvas(e) {
    if (e.target.closest && e.target.closest('.be-sticker')) return;
    if (_boardActiveIdx >= 0) deselectBoardSticker();
  }

  // ── Stickers ──────────────────────────────────────────────────────
  function addStickerToBoard(itemId) {
    const item = getItem(itemId);
    if (!item) return;
    const canvasEl = document.getElementById('be-canvas');
    const canvasW = canvasEl ? canvasEl.offsetWidth : 300;
    const canvasH = canvasEl ? canvasEl.offsetHeight : Math.round(canvasW * 4/3);
    const size = Math.round(canvasW * 0.42);
    const n = _boardStickers.length;
    const jitter = (n % 6) * 20;
    const sticker = {
      itemId,
      img: item.img || '',
      name: item.name,
      x: Math.max(0, Math.min(canvasW - size, Math.round(canvasW / 2 - size / 2) + jitter - 60)),
      y: Math.max(0, Math.min(canvasH - size, Math.round(canvasH / 2 - size / 2) + jitter - 60)),
      w: size, h: size,
      aspect: 1,
    };
    if (item.img) {
      const _img = new Image();
      _img.onload = () => {
        if (_img.naturalWidth && _img.naturalHeight) {
          sticker.aspect = _img.naturalWidth / _img.naturalHeight;
          sticker.h = Math.round(size / sticker.aspect);
          const el = document.querySelector(`.be-sticker[data-idx="${_boardStickers.indexOf(sticker)}"]`);
          if (el) el.style.height = sticker.h + 'px';
        }
      };
      _img.src = item.img;
    }
    const idx = _boardStickers.length;
    _boardStickers.push(sticker);
    if (canvasEl) {
      canvasEl.insertAdjacentHTML('beforeend', boardStickerHtml(sticker, idx));
    }
    selectBoardSticker(idx);
  }

  function removeBoardSticker(idx) {
    _boardStickers.splice(idx, 1);
    const canvasEl = document.getElementById('be-canvas');
    if (canvasEl) {
      canvasEl.innerHTML = _boardStickers.map((st, i) => boardStickerHtml(st, i)).join('');
    }
  }

  // ── Drag: move ────────────────────────────────────────────────────
  function boardStickerDown(e, idx) {
    if (e.target.classList.contains('be-sticker-resize')) return;
    e.preventDefault();
    e.stopPropagation();
    // Tap on unselected sticker → select it, don't drag
    if (idx !== _boardActiveIdx) {
      selectBoardSticker(idx);
      return;
    }
    const st = _boardStickers[idx];
    _boardDrag = { type: 'move', idx, startX: e.clientX, startY: e.clientY, origX: st.x, origY: st.y, hasMoved: false };
    document.addEventListener('pointermove', _onBoardMove, { passive: false });
    document.addEventListener('pointerup', _onBoardUp);
    document.addEventListener('pointercancel', _onBoardUp);
  }

  // ── Drag: resize ──────────────────────────────────────────────────
  function boardResizeDown(e, idx) {
    e.preventDefault();
    e.stopPropagation();
    const st = _boardStickers[idx];
    const aspect = st.aspect || (st.w / st.h);
    _boardDrag = { type: 'resize', idx, startX: e.clientX, startY: e.clientY, origW: st.w, origH: st.h, aspect, hasMoved: false };
    document.addEventListener('pointermove', _onBoardMove, { passive: false });
    document.addEventListener('pointerup', _onBoardUp);
    document.addEventListener('pointercancel', _onBoardUp);
  }

  function _onBoardMove(e) {
    if (!_boardDrag) return;
    e.preventDefault();
    const dx = e.clientX - _boardDrag.startX;
    const dy = e.clientY - _boardDrag.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) _boardDrag.hasMoved = true;
    if (!_boardDrag.hasMoved) return;
    const idx = _boardDrag.idx;
    const st = _boardStickers[idx];
    const canvasEl = document.getElementById('be-canvas');
    const canvasW = canvasEl ? canvasEl.offsetWidth : 300;
    const canvasH = canvasEl ? canvasEl.offsetHeight : Math.round(canvasW * 4/3);
    const el = canvasEl ? canvasEl.querySelector(`.be-sticker[data-idx="${idx}"]`) : null;
    if (!el) return;
    if (_boardDrag.type === 'move') {
      const newX = Math.max(-st.w * 0.5, Math.min(canvasW - st.w * 0.5, _boardDrag.origX + dx));
      const newY = Math.max(-st.h * 0.5, Math.min(canvasH - st.h * 0.5, _boardDrag.origY + dy));
      st.x = newX; st.y = newY;
      el.style.left = newX + 'px'; el.style.top = newY + 'px';
      const delBtn = document.getElementById('be-action-del');
      if (delBtn) {
        const r = delBtn.getBoundingClientRect();
        const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        delBtn.classList.toggle('drag-target', over);
      }
    } else {
      const newW = Math.max(40, _boardDrag.origW + dx);
      const newH = Math.max(40, Math.round(newW / _boardDrag.aspect));
      st.w = newW; st.h = newH;
      el.style.width = newW + 'px'; el.style.height = newH + 'px';
    }
  }

  function _onBoardUp() {
    if (!_boardDrag) return;
    const { hasMoved, idx, type } = _boardDrag;
    _boardDrag = null;
    document.removeEventListener('pointermove', _onBoardMove);
    document.removeEventListener('pointerup', _onBoardUp);
    document.removeEventListener('pointercancel', _onBoardUp);
    const delBtn = document.getElementById('be-action-del');
    const overDelete = delBtn && delBtn.classList.contains('drag-target');
    if (delBtn) delBtn.classList.remove('drag-target');
    if (type === 'move' && hasMoved && overDelete) {
      _boardActiveIdx = -1;
      removeBoardSticker(idx);
      setBoardPanel('collapsed');
      const bar = document.getElementById('be-action-bar');
      if (bar) bar.classList.remove('visible');
      return;
    }
    if (!hasMoved) selectBoardSticker(idx);
  }

  function drawImageContain(ctx, img, x, y, w, h) {
    const ia = img.naturalWidth / img.naturalHeight;
    const ba = w / h;
    let dw, dh;
    if (ia > ba) { dw = w; dh = w / ia; }
    else          { dh = h; dw = h * ia; }
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }

  // ── Save board: compose to canvas, store PNG ──────────────────────
  async function saveBoardFinal() {
    if (_boardStickers.length === 0) { showToast('Add some items first'); return; }

    const canvasEl = document.getElementById('be-canvas');
    const canvasW = canvasEl ? canvasEl.offsetWidth : 300;
    const canvasH = canvasEl ? canvasEl.offsetHeight : Math.round(canvasW * 4/3);
    const EXPORT = 750;
    const EXPORT_H = Math.round(canvasH * EXPORT / canvasW);
    const scale = EXPORT / canvasW;

    const canvas = document.createElement('canvas');
    canvas.width = EXPORT; canvas.height = EXPORT_H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, EXPORT, EXPORT_H);

    let hasCorsFail = false;
    for (const st of _boardStickers) {
      if (!st.img) continue;
      try {
        const img = await new Promise((res, rej) => {
          const i = new Image();
          // Only set crossOrigin for external URLs (data: doesn't need it)
          if (!st.img.startsWith('data:')) i.crossOrigin = 'anonymous';
          i.onload = () => res(i);
          i.onerror = rej;
          i.src = st.img;
        });
        drawImageContain(ctx, img, st.x * scale, st.y * scale, st.w * scale, st.h * scale);
      } catch {
        hasCorsFail = true;
        ctx.fillStyle = '#e8e8e8';
        ctx.fillRect(st.x * scale, st.y * scale, st.w * scale, st.h * scale);
      }
    }

    let boardImg = '';
    try {
      boardImg = canvas.toDataURL('image/jpeg', 0.85);
    } catch {
      // Canvas tainted by external image — export without those
      hasCorsFail = true;
      const safeCanvas = document.createElement('canvas');
      safeCanvas.width = EXPORT; safeCanvas.height = EXPORT_H;
      const sCtx = safeCanvas.getContext('2d');
      sCtx.fillStyle = '#fff';
      sCtx.fillRect(0, 0, EXPORT, EXPORT_H);
      for (const st of _boardStickers) {
        if (!st.img || !st.img.startsWith('data:')) {
          sCtx.fillStyle = '#e8e8e8';
          sCtx.fillRect(st.x * scale, st.y * scale, st.w * scale, st.h * scale);
          continue;
        }
        try {
          const img = await new Promise((res, rej) => {
            const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = st.img;
          });
          drawImageContain(sCtx, img, st.x * scale, st.y * scale, st.w * scale, st.h * scale);
        } catch {}
      }
      boardImg = safeCanvas.toDataURL('image/jpeg', 0.85);
    }

    const board = {
      id: _boardEditId || ('b' + genId()),
      name: _boardName,
      img: boardImg,
      stickers: _boardStickers.map(st => ({ itemId: st.itemId, x: st.x, y: st.y, w: st.w, h: st.h })),
      createdAt: Date.now(),
    };

    if (_boardEditId) {
      boards = boards.map(b => b.id === _boardEditId ? board : b);
    } else {
      boards.unshift(board);
    }
    saveBoardData();

    if (_boardFromWid) {
      wishlists = wishlists.map(w => w.id === _boardFromWid ? { ...w, boardId: board.id, coverImg: board.img } : w);
      saveData();
    }

    _boardDrag = null;
    document.removeEventListener('pointermove', _onBoardMove);
    document.removeEventListener('pointerup', _onBoardUp);
    document.removeEventListener('pointercancel', _onBoardUp);

    if (_boardFromWid) {
      s.screen = 'wishlist-detail';
      s.currentWid = _boardFromWid;
      _boardFromWid = null;
    } else if (_boardFromDetail) {
      s.screen = 'board-detail';
      s.currentBoardId = board.id;
      _boardFromDetail = false;
    } else {
      s.screen = 'boards';
    }
    render();
  }

  async function saveBoardToCamera() {
    const canvasEl = document.getElementById('be-canvas');
    const canvasW = canvasEl ? canvasEl.offsetWidth : 300;
    const canvasH = canvasEl ? canvasEl.offsetHeight : Math.round(canvasW * 4/3);
    const EXPORT = 750;
    const EXPORT_H = Math.round(canvasH * EXPORT / canvasW);
    const scale = EXPORT / canvasW;

    const canvas = document.createElement('canvas');
    canvas.width = EXPORT; canvas.height = EXPORT_H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, EXPORT, EXPORT_H);

    for (const st of _boardStickers) {
      if (!st.img) continue;
      try {
        const img = await new Promise((res, rej) => {
          const i = new Image();
          if (!st.img.startsWith('data:')) i.crossOrigin = 'anonymous';
          i.onload = () => res(i); i.onerror = rej; i.src = st.img;
        });
        drawImageContain(ctx, img, st.x * scale, st.y * scale, st.w * scale, st.h * scale);
      } catch { /* skip tainted images */ }
    }

    try {
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
      const file = new File([blob], 'board.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'My Board' });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'board.jpg'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    } catch(err) {
      if (err.name !== 'AbortError') showToast('Could not save image');
    }
  }

  function confirmDeleteBoard(e, boardId) {
    if (e) e.stopPropagation();
    s.pendingDeleteBoardId = boardId;
    s.overlay = 'confirm-delete-board';
    render();
  }

  function deleteBoard(boardId) {
    boards = boards.filter(b => b.id !== boardId);
    saveBoardData();
    s.overlay = null;
    s.pendingDeleteBoardId = null;
    if (s.screen === 'board-editor') cancelBoardEdit();
    else render();
  }

  // ═══════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════

  loadData();

  // ─── Async init: decode shared URL (may require decompression), then render ──
  (async () => {
    const hash = location.hash;

    // ─── Force install sheet (#install) ────────────────────────────
    // When someone taps "Get the App" from a shared wishlist, they land here
    // with #install and we show the onboarding sheet regardless of dismissed state.
    if (hash === '#install') {
      history.replaceState(null, '', location.pathname + location.search);
      render();
      showOnboarding();
      return;
    }

    // ─── Bookmarklet pre-fill (#bm=base64JSON) ─────────────────────
    // When the bookmarklet runs on a product page, it encodes name/img/price/brand
    // and opens the app here — we skip the URL fetch entirely and pre-fill the form.
    if (hash.startsWith('#bm=')) {
      try {
        const bm = JSON.parse(decodeURIComponent(escape(atob(hash.slice(4)))));
        history.replaceState(null, '', location.pathname + location.search);
        s.screen = 'add-item';
        s.addStep = 'form';
        s.addIsEdit = false;
        s.addForm = {
          url: bm.url || '', name: bm.name || '', brand: bm.brand || '',
          tags: [], img: bm.img || '', imgCandidates: [], price: bm.price || '',
          saved: '', note: '', wid: wishlists[0]?.id || '',
          showTagInput: false,
          tagQuery: '', showNewWl: false,
        };
      } catch {}
      render();
      autoRemoveBgIfWhite();
      return;
    }

    if (hash.startsWith('#share=')) {
      const decoded = await decodeShare(hash.slice(7));
      if (decoded?.wl && Array.isArray(decoded.items)) {
        shareData = decoded;
        s.screen = 'shared-wl';
      }
    }

    if (hash.startsWith('#board=')) {
      const decoded = await decodeBoardShare(hash.slice(7));
      if (decoded?.stickers) {
        history.replaceState(null, '', location.pathname + location.search);
        _boardEditId = null;
        _boardName = '';
        _boardStickers = decoded.stickers.map(st => ({
          itemId: null, img: st.img || '', name: '', x: st.x, y: st.y, w: st.w, h: st.h
        }));
        _boardDrag = null;
        s.screen = 'board-editor';
      }
    }

    // ─── Onboarding ────────────────────────────────────────────────
    // Show install prompt when opened in Safari (not yet installed as PWA),
    // unless the user already dismissed it or is viewing a shared wishlist.
    const isInstalled = window.navigator.standalone === true
      || window.matchMedia('(display-mode: standalone)').matches;
    const obDismissed = (() => { try { return !!localStorage.getItem('vtr_ob_dismissed'); } catch(e) { return false; } })();

    // ─── Analytics: install tracking ───────────────────────────────
    // Android/Chrome: fires when user taps "Add to Home Screen"
    window.addEventListener('appinstalled', () => {
      if (typeof gtag === 'function') gtag('event', 'pwa_install', { method: 'android' });
    });
    // iOS: no appinstalled event — detect first standalone launch instead
    if (isInstalled) {
      const firstStandalone = !localStorage.getItem('vtr_standalone_seen');
      if (firstStandalone) {
        localStorage.setItem('vtr_standalone_seen', '1');
        if (typeof gtag === 'function') gtag('event', 'pwa_install', { method: 'ios_standalone' });
      }
    }

    if (shareData) {
      // Viewing a shared wishlist — skip onboarding and name prompt
      render();
    } else if (!isSignedIn()) {
      // First-time user — mandatory sign-up gate, blocks the rest of the app
      showNamePrompt();
    } else if (!isInstalled && !obDismissed) {
      // Signed in, but not installed yet — render app, then show install dialog after a short delay
      render();
      setTimeout(showOnboarding, 800);
    } else {
      render();
    }

    // ─── Register service worker — auto-reload when a new version activates
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
      // When a new SW takes control (skipWaiting fired), reload to get fresh code
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
  })();

  // ─── Swipe back gesture (left-edge → right) with live drag ──────
  (function initSwipeBack() {
    const EDGE = 30;   // px from left edge to begin tracking
    const MIN_X = 72;  // px horizontal travel to trigger
    let startX = 0, startY = 0, tracking = false, dragging = false;

    const SWIPEABLE = new Set(['wishlist-detail','board-detail','item-detail','shared-item','add-item','add-wishlist']);

    function swipeBack() {
      switch (s.screen) {
        case 'wishlist-detail':
          navTo('wishlists');
          break;
        case 'board-detail':
          navTo('boards');
          break;
        case 'item-detail': {
          const item = getItem(s.currentIid);
          if (s.fromScreen === 'items') navTo('items');
          else if (s.fromScreen === 'wishlists') navTo('wishlists');
          else if (item?.wid) openWl(item.wid);
          else navTo('wishlists');
          break;
        }
        case 'shared-item':
          s.screen = 'shared-wl'; render();
          break;
        case 'add-item':
        case 'add-wishlist':
          cancelAdd();
          break;
      }
    }

    function getPageEl() { return document.getElementById('app'); }

    function applyDrag(dx) {
      const el = getPageEl();
      if (!el) return;
      const clamped = Math.max(0, dx);
      el.style.transform = `translateX(${clamped}px)`;
      el.style.transition = 'none';
      el.style.boxShadow = `-8px 0 24px rgba(0,0,0,${0.08 * Math.min(clamped / 200, 1)})`;
    }

    function resetDrag(commit) {
      const el = getPageEl();
      if (!el) return;
      if (commit) {
        el.style.transition = 'transform 0.22s ease-out';
        el.style.transform = `translateX(${window.innerWidth}px)`;
        setTimeout(() => {
          el.style.transform = '';
          el.style.transition = '';
          el.style.boxShadow = '';
          swipeBack();
        }, 220);
      } else {
        el.style.transition = 'transform 0.2s ease-out';
        el.style.transform = 'translateX(0)';
        el.style.boxShadow = '';
        setTimeout(() => {
          el.style.transition = '';
        }, 200);
      }
    }

    const el = document.getElementById('app');
    el.addEventListener('touchstart', e => {
      if (!SWIPEABLE.has(s.screen)) return;
      const t = e.touches[0];
      if (t.clientX <= EDGE) {
        startX = t.clientX; startY = t.clientY; tracking = true; dragging = false;
      } else { tracking = false; }
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      if (!tracking) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = Math.abs(t.clientY - startY);
      if (!dragging) {
        // Confirm horizontal intent before starting drag
        if (dx > 8 && dy < dx * 0.65) { dragging = true; }
        else if (dy > 10) { tracking = false; return; }
      }
      if (dragging) applyDrag(dx);
    }, { passive: true });

    el.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = Math.abs(t.clientY - startY);
      if (dragging) {
        dragging = false;
        resetDrag(dx >= MIN_X && dy < dx * 0.65);
      }
    }, { passive: true });

    el.addEventListener('touchcancel', () => {
      if (!tracking) return;
      tracking = false;
      if (dragging) { dragging = false; resetDrag(false); }
    }, { passive: true });
  })();

  // ─── Horizontal swipe for sub-tabs AND main nav tabs ─────
  // Items ↔ Category ↔ Lists only — deliberately does NOT reach Boards, and
  // the content visually follows the finger during the drag (rather than only
  // snapping at release) so it doesn't feel choppy.
  (function initSubTabSwipe() {
    const SUB_TABS = ['items', 'wishlists'];
    const MIN_X = 48;
    let startX = 0, startY = 0, tracking = false, dragging = false, contentEl = null;

    function isSubTabScreen() { return SUB_TABS.includes(s.screen); }

    function resetContent() {
      if (!contentEl) return;
      contentEl.style.transition = '';
      contentEl.style.transform = '';
      contentEl = null;
    }

    document.getElementById('app').addEventListener('touchstart', e => {
      if (!isSubTabScreen()) return;
      // Don't interfere with the swipe-back gesture (left edge)
      const t = e.touches[0];
      if (t.clientX <= 30) return;
      startX = t.clientX; startY = t.clientY; tracking = true; dragging = false;
    }, { passive: true });

    document.getElementById('app').addEventListener('touchmove', e => {
      if (!tracking || !isSubTabScreen()) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = Math.abs(t.clientY - startY);
      if (!dragging) {
        if (Math.abs(dx) > 8 && dy < Math.abs(dx) * 0.6) {
          dragging = true;
          contentEl = document.getElementById('wl-subtab-scroll');
        } else if (dy > 10) { tracking = false; return; }
      }
      if (!dragging || !contentEl) return;
      const cur = SUB_TABS.indexOf(s.screen);
      // Rubber-band resistance at the first/last sub-tab so it's clear you've hit the end
      const atStart = cur === 0 && dx > 0;
      const atEnd = cur === SUB_TABS.length - 1 && dx < 0;
      const live = (atStart || atEnd) ? dx * 0.3 : dx;
      contentEl.style.transition = 'none';
      contentEl.style.transform = `translateX(${live}px)`;
    }, { passive: true });

    document.getElementById('app').addEventListener('touchend', e => {
      if (!tracking || !isSubTabScreen()) { tracking = false; return; }
      tracking = false;
      if (!dragging) return;
      dragging = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = Math.abs(t.clientY - startY);
      const cur = SUB_TABS.indexOf(s.screen);
      const valid = Math.abs(dx) >= MIN_X && dy < Math.abs(dx) * 0.6;
      const target = valid && dx < 0 && cur < SUB_TABS.length - 1 ? cur + 1
        : valid && dx > 0 && cur > 0 ? cur - 1
        : cur;

      if (!contentEl) return;
      if (target !== cur) {
        // Carry the dragged content the rest of the way off-screen, then hand
        // off to setWlSubTab — its own slide-in animation continues the motion
        // for the incoming screen so the whole thing reads as one gesture.
        const dir = target > cur ? -1 : 1;
        const el = contentEl;
        el.style.transition = 'transform 0.2s cubic-bezier(0.4,0,0.2,1)';
        el.style.transform = `translateX(${dir * window.innerWidth}px)`;
        contentEl = null;
        setTimeout(() => { setWlSubTab(SUB_TABS[target]); }, 200);
      } else {
        contentEl.style.transition = 'transform 0.25s cubic-bezier(0.16,1,0.3,1)';
        contentEl.style.transform = '';
        const el = contentEl;
        contentEl = null;
        setTimeout(() => { el.style.transition = ''; }, 250);
      }
    }, { passive: true });

    document.getElementById('app').addEventListener('touchcancel', () => {
      tracking = false; dragging = false;
      resetContent();
    }, { passive: true });
  })();

  // ─── Web Share Target ────────────────────────────────────────────
  // When the user taps "Share → Curate" in their browser, the OS
  // opens the app at /?url=<product-url> (per manifest share_target).
  // Detect it, clean the URL from history, and immediately fetch.
  (function handleShareTarget() {
    const p = new URLSearchParams(location.search);
    let sharedUrl = p.get('url') || '';
    if (!sharedUrl) {
      const text = p.get('text') || '';
      const m = text.match(/https?:\/\/\S+/);
      if (m) sharedUrl = m[0];
    }
    if (!sharedUrl) return;
    try { new URL(sharedUrl); } catch { return; }
    history.replaceState({}, '', '/');
    s.screen = 'add-item';
    s.addStep = 'form';
    s.addForm = { ...s.addForm, url: sharedUrl, name: p.get('title') || '', imgCandidates: [] };
    fetchUrl(); // shows the form immediately, fields fill in as sources resolve
  })();
  </script>
</body>
